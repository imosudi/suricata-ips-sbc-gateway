# =============================================================================
# rule_mapping.yaml — Maps Suricata SID ranges/values to harness modules
# Used by analyzers/sid_mapper.py to attribute detections to modules.
# SID namespace: 9000001–9009999 (lab custom rules)
# =============================================================================

modules:

  icmp:
    description: "ICMP-based attacks"
    sid_ranges:
      - {start: 9000001, end: 9000099}
    sid_exact: []
    keywords: ["icmp", "ping", "flood"]

  scan:
    description: "Network scanning and reconnaissance"
    sid_ranges:
      - {start: 9001001, end: 9001099}
    sid_exact: [2000537, 2000538]   # ET SCAN SYN/FIN
    keywords: ["scan", "nmap", "xmas", "null scan"]

  dns:
    description: "DNS abuse and tunnelling"
    sid_ranges:
      - {start: 9002001, end: 9002099}
    keywords: ["dns", "nxdomain", "tunnel"]

  ssh:
    description: "SSH brute force and probing"
    sid_ranges:
      - {start: 9003001, end: 9003099}
    keywords: ["ssh", "brute", "authentication failed"]

  http:
    description: "HTTP attacks — SQLi, XSS, path traversal, scanners"
    sid_ranges:
      - {start: 9004001, end: 9004099}
    keywords: ["http", "sql injection", "xss", "nikto", "traversal"]

  tls:
    description: "TLS/SSL anomalies"
    sid_ranges:
      - {start: 9005001, end: 9005099}
    keywords: ["tls", "ssl", "certificate", "cipher"]

  ftp:
    description: "FTP abuse"
    sid_ranges:
      - {start: 9006001, end: 9006099}
    keywords: ["ftp", "anonymous"]

  smtp:
    description: "SMTP abuse and open relay"
    sid_ranges:
      - {start: 9007001, end: 9007099}
    keywords: ["smtp", "mail", "relay"]

  policy:
    description: "Policy violations — Tor, P2P, IRC"
    sid_ranges:
      - {start: 9008001, end: 9008099}
    keywords: ["tor", "bittorrent", "irc", "policy"]

  benign:
    description: "Legitimate traffic — should NOT appear in alerts"
    sid_ranges: []
    keywords: []
    note: "Any alert attributed here counts as a false positive"
