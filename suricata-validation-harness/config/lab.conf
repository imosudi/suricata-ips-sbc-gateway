# =============================================================================
# lab.conf — Kali attacker-side configuration
# The harness runs ON KALI and attacks the remote Suricata gateway.
# All collection from the gateway uses SSH/SCP — no local Suricata assumed.
# =============================================================================

# ---------------------------------------------------------------------------
# GATEWAY (Suricata host) — SSH access for collection
# ---------------------------------------------------------------------------
GW_HOST="10.10.10.1"               # Suricata gateway IP
GW_USER="suricata-admin"            # SSH user on gateway (needs sudo or log read perms)
GW_SSH_KEY="$HOME/.ssh/id_ed25519_lab"  # SSH identity file (passwordless recommended)
GW_SSH_PORT=22
GW_SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=5 -o BatchMode=yes"

# Remote paths on the GATEWAY
GW_EVE_LOG="/var/log/suricata/eve.json"
GW_STATS_LOG="/var/log/suricata/stats.log"
GW_SURICATA_SOCKET="/var/run/suricata/suricata-command.socket"
GW_SURICATA_RULES_DIR="/etc/suricata/rules"
GW_PCAP_DIR="/var/log/suricata/pcap"   # if Suricata pcap-log is enabled

# ---------------------------------------------------------------------------
# ATTACK TARGETS (on the network protected by the gateway)
# ---------------------------------------------------------------------------
PRIMARY_TARGET="10.10.10.2"         # Primary victim host behind gateway
SECONDARY_TARGETS="10.10.10.3,10.10.10.4"

# ---------------------------------------------------------------------------
# LOCAL KALI PATHS
# ---------------------------------------------------------------------------
HARNESS_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
LOG_DIR="$HARNESS_DIR/logs"
RESULTS_DIR="$HARNESS_DIR/results"
PCAP_DIR="$HARNESS_DIR/pcaps"
ARCHIVE_DIR="$HARNESS_DIR/archive"

# ---------------------------------------------------------------------------
# KALI-SIDE PCAP capture (local interface, captures outbound attack traffic)
# ---------------------------------------------------------------------------
KALI_IFACE="eth0"                   # Kali's outbound interface toward the lab
PCAP_ENABLED=true
PCAP_SNAPLEN=65535
PCAP_FILTER=""                      # BPF filter; empty = all on KALI_IFACE

# ---------------------------------------------------------------------------
# Suricata mode on gateway — determines whether IPS block-rate is scored
# ---------------------------------------------------------------------------
SURICATA_MODE="ids"                 # ids | ips

# ---------------------------------------------------------------------------
# Timing
# ---------------------------------------------------------------------------
ATTACK_DURATION=5                   # seconds each attack step runs
INTER_ATTACK_SLEEP=2                # cooldown between modules
EVE_COLLECTION_DELAY=3             # wait after attacks before pulling EVE
EVE_TAIL_LINES=5000                 # lines to fetch from remote EVE log
