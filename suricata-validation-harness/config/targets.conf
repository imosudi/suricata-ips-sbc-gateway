# =============================================================================
# targets.conf — Attack target definitions (Kali perspective)
# These are hosts on the VICTIM network, reachable through / monitored by
# the Suricata gateway. The gateway itself (GW_HOST) is defined in lab.conf.
# =============================================================================

# Primary victim host — receives most attack traffic
PRIMARY_TARGET="10.10.10.2"

# Additional hosts used by scan / multi-host modules
SECONDARY_TARGETS="10.10.10.3,10.10.10.4"

# Hosts that must NEVER be targeted (safety guard in validation_harness.sh)
EXCLUDED_HOSTS="10.10.10.254,127.0.0.1,::1"

# Protocol-specific overrides (default to PRIMARY_TARGET if not set)
DNS_TARGET="10.10.10.2"
HTTP_TARGET="http://10.10.10.2"
HTTPS_TARGET="https://10.10.10.2"
FTP_TARGET="10.10.10.2"
FTP_PORT=21
SMTP_TARGET="10.10.10.2"
SMTP_PORT=25
SSH_TARGET="10.10.10.2"
SSH_PORT=22
TLS_TARGET="10.10.10.2"
TLS_PORT=443
