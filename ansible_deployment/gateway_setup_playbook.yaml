# playbook: gateway_setup_playbook.yaml
---
# gateway_setup_playbook.yaml
# Ansible playbook for Gateway System Setup
# SBC: Single Board Computer - Orange Pi / Raspberry Pi / Ubuntu 24.04 LTS / Debian 12
# Mosudi I.O, FH Technikum Wien - IT Security Lab 2026
#
# Usage:
#   ansible-playbook -K gateway_setup_playbook.yaml
#   or with custom vars:
#   ansible-playbook -K gateway_setup_playbook.yaml -e "lan_ip=10.10.10.1 wifi_ssid=MySSID"
#
# What this playbook does:
#   1. System update & core package installation
#   2. Netplan static LAN / DHCP WAN configuration
#   3. IP forwarding (runtime + persistent)
#   4. iptables NAT + FORWARD rules + persistence
#   5. ISC DHCP server configuration and startup
#   6. Custom MOTD deployment


# ROUTING MODES:
#   "nat"   - Source-NAT (MASQUERADE): LAN clients appear as gateway's WAN IP
#             Use when upstream router does NOT have return route to LAN_SUBNET
#   "route" - Pure IP forwarding: packets forwarded without address rewriting
#             Use when upstream router has static route back to LAN_SUBNET

- name: Gateway System Setup for SBC (Orange Pi/Raspberry Pi)
  hosts: all
  become: yes
  gather_facts: yes



  # ============================================================================
  # PRE_TASKS - Validation and environment setup
  # ============================================================================
  pre_tasks:
    - name: Pre-flight - Display banner
      debug:
        msg:
          - ""
          - "╔══════════════════════════════════════════════════════════╗"
          - "║   Gateway Setup Playbook                                 ║"
          - "║   Ubuntu 24.04 / Debian 12                               ║"
          - "║   Orange Pi / Raspberry Pi                               ║"
          - "║   Mosudi I.O, FH Technikum Wien - IT Security Lab 2026   ║"
          - "╚══════════════════════════════════════════════════════════╝"
          - ""
          - "  Mode: {{ routing_mode | upper }}"
          - "  LAN:  {{ lan_iface }}  →  {{ lan_cidr }}"
          - "  WAN:  {{ wan_iface }}  →  DHCP (SSID: {{ wifi_ssid }})"
          - "  DHCP: {{ dhcp_range_start }} - {{ dhcp_range_end }}"
          - "  DNS:  {{ dns_primary }}, {{ dns_secondary }}"
          - ""

    - name: Pre-flight - Verify running with proper privileges
      assert:
        that:
          - ansible_user_id == 'root'
        fail_msg: "This playbook must be run as root. Use -K (--ask-become-pass) option."
        success_msg: " Running with proper privileges"

    - name: Pre-flight - Validate routing mode
      assert:
        that:
          - routing_mode in ['nat', 'route']
        fail_msg: "routing_mode must be 'nat' or 'route' (got: '{{ routing_mode }}')"
        success_msg: " Routing mode validated: {{ routing_mode }}"

    - name: Pre-flight - Check LAN interface exists
      ansible.builtin.shell: ip link show {{ lan_iface }} &>/dev/null
      register: lan_iface_check
      failed_when: false
      changed_when: false

    - name: Pre-flight - LAN interface validation
      assert:
        that:
          - lan_iface_check.rc == 0
        fail_msg: "LAN interface '{{ lan_iface }}' not found. Check configuration."
        success_msg: " LAN interface {{ lan_iface }} found"

    - name: Pre-flight - WAN interface check (warning only)
      ansible.builtin.shell: ip link show {{ wan_iface }} &>/dev/null
      register: wan_iface_check
      failed_when: false
      changed_when: false

    - name: Pre-flight - WAN interface warning
      debug:
        msg: "⚠ WAN interface '{{ wan_iface }}' not found - it may appear after Netplan applies Wi-Fi config."
      when: wan_iface_check.rc != 0

    - name: Pre-flight - Display OS information
      debug:
        msg: " OS: {{ ansible_distribution }} {{ ansible_distribution_version }} ({{ ansible_architecture }})"

    - name: Pre-flight - Route mode prerequisite reminder
      debug:
        msg:
          - "⚠ ROUTING MODE: ensure the upstream router/host has a static"
          - "  return route to {{ lan_subnet }} via this gateway's WAN IP."
          - "  Example (on Kali/upstream host):"
          - "    sudo ip route add {{ lan_subnet }} via <gateway-WAN-IP>"
      when: routing_mode == "route"

    - name: Pre-flight - Load .env file if present
      block:
        - name: Copy .env to remote
          ansible.builtin.copy:
            src: "../.env"
            dest: "/tmp/gateway.env"
          register: env_copy
          ignore_errors: yes

        - name: Read .env file
          ansible.builtin.slurp:
            src: "/tmp/gateway.env"
          register: env_file
          when: env_copy is not failed
          ignore_errors: yes

        - name: Parse .env file
          set_fact:
            env_vars: >-
              {{
                dict(
                  env_file.content | b64decode
                  | regex_replace('\r\n', '\n')
                  | split('\n')
                  | select('match', '^[A-Za-z_][A-Za-z0-9_]*=.*$')
                  | map('split', '=', 1)
                  | list
                )
              }}
          when: env_file is defined and env_file is not failed

        - name: Set Wi-Fi variables from .env
          set_fact:
            wifi_ssid: "{{ env_vars.WIFI_SSID | default(wifi_ssid) }}"
            wifi_password: "{{ env_vars.WIFI_PASSWORD | default(wifi_password) }}"
          when: env_vars is defined
          no_log: true
      tags: [env, wifi]

    - name: Pre-flight - Validate Wi-Fi configuration
      assert:
        that:
          - wifi_ssid != "SSID_NAME"
          - wifi_password != "PASSWORD"
        fail_msg: |
          Wi-Fi credentials not properly configured!
          Set WIFI_SSID and WIFI_PASSWORD in .env file or override with -e.
        success_msg: " Wi-Fi configuration validated"

    - name: Pre-flight - Bootstrap DNS (temporary resolv.conf)
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: |
          nameserver {{ dns_primary }}
          nameserver {{ dns_secondary }}
        mode: '0644'

  # ============================================================================
  # TASKS - Main configuration
  # ============================================================================
  tasks:
    # --------------------------------------------------------------------------
    # Step 1: System Update & Package Installation
    # --------------------------------------------------------------------------
    - name: Step 1 - System Update & Package Installation
      block:
        - name: Update package lists
          ansible.builtin.apt:
            update_cache: yes
            cache_valid_time: 3600

        - name: Upgrade installed packages
          ansible.builtin.apt:
            upgrade: dist
            force_apt_get: yes

        - name: Remove unused packages
          ansible.builtin.apt:
            autoremove: yes
            purge: yes

        - name: Install core networking packages
          ansible.builtin.apt:
            name: "{{ required_packages }}"
            state: present
            force_apt_get: yes
      tags: [packages, system]

    # --------------------------------------------------------------------------
    # Step 2: Netplan Network Configuration
    # --------------------------------------------------------------------------
    - name: Step 2 - Netplan Network Configuration
      block:
        - name: Remove conflicting Netplan files
          ansible.builtin.find:
            paths: /etc/netplan/
            patterns: "*.yaml"
            excludes: "{{ netplan_file | basename }}"
          register: netplan_files

        - name: Archive conflicting Netplan files
          ansible.builtin.copy:
            src: "{{ item.path }}"
            dest: "{{ item.path }}.disabled"
            remote_src: yes
            backup: yes
          loop: "{{ netplan_files.files }}"
          when: netplan_files.files | length > 0

        - name: Write Netplan configuration
          ansible.builtin.copy:
            dest: "{{ netplan_file }}"
            mode: '0600'
            content: |
              # Generated by Ansible gateway_setup_playbook.yaml - {{ ansible_date_time.iso8601 }}
              # LAN: {{ lan_iface }}  WAN: {{ wan_iface }}  Mode: {{ routing_mode }}
              network:
                version: 2
                renderer: networkd
              
                ethernets:
                  {{ lan_iface }}:
                    dhcp4: no
                    addresses:
                      - {{ lan_cidr }}
              
                wifis:
                  {{ wan_iface }}:
                    dhcp4: yes
                    nameservers:
                      addresses:
                        - {{ dns_primary }}
                        - {{ dns_secondary }}
                    access-points:
                      "{{ wifi_ssid }}":
                        password: "{{ wifi_password }}"

        - name: Apply Netplan configuration
          ansible.builtin.command: netplan apply
          register: netplan_apply
          changed_when: netplan_apply.rc == 0

        - name: Wait for interfaces to stabilize
          ansible.builtin.pause:
            seconds: 5

        - name: Ensure LAN interface is administratively up
          ansible.builtin.command: ip link set {{ lan_iface }} up
          changed_when: false

        - name: Force LAN interface address if needed
          ansible.builtin.command: ip addr replace {{ lan_cidr }} dev {{ lan_iface }}
          changed_when: false

        - name: Verify LAN interface address
          ansible.builtin.shell: ip -4 addr show {{ lan_iface }} 2>/dev/null | awk '/inet / {print $2}' | head -1
          register: lan_addr_check
          changed_when: false

        - name: Assert LAN interface address is configured
          assert:
            that:
              - lan_addr_check.stdout == lan_cidr
            fail_msg: >-
              {{ lan_iface }} does not have {{ lan_cidr }} after netplan apply.
              Current IPv4 addresses: {{ lan_addr_check.stdout | default('none', true) }}
            success_msg: " {{ lan_iface }} assigned {{ lan_addr_check.stdout }}"

        - name: Display routing table
          ansible.builtin.command: ip route
          register: routing_table
          changed_when: false

        - name: Show routing table
          debug:
            msg: "{{ routing_table.stdout_lines }}"
      tags: [netplan, network]

    # --------------------------------------------------------------------------
    # Step 3: IP Forwarding
    # --------------------------------------------------------------------------
    - name: Step 3 - IP Forwarding
      block:
        - name: Write persistent sysctl configuration
          ansible.builtin.copy:
            dest: "{{ sysctl_file }}"
            mode: '0644'
            content: |
              # Generated by Ansible gateway_setup_playbook.yaml - {{ ansible_date_time.iso8601 }}
              net.ipv4.ip_forward = 1
              # Disable RP filter on all interfaces to allow asymmetric routing in route mode
              net.ipv4.ip_forward = 1

              {% if routing_mode == "route" %}
                net.ipv4.conf.all.rp_filter = 0
                net.ipv4.conf.{{ lan_iface }}.rp_filter = 0
                net.ipv4.conf.{{ wan_iface }}.rp_filter = 0
              {% endif %}

        - name: Apply sysctl settings
          ansible.builtin.command: sysctl -p {{ sysctl_file }}
          register: sysctl_apply
          changed_when: sysctl_apply.rc == 0

        - name: Verify IP forwarding is enabled
          ansible.builtin.shell: sysctl -n net.ipv4.ip_forward
          register: fwd_check
          changed_when: false

        - name: Verify RP filter is disabled
          ansible.builtin.shell: sysctl -n net.ipv4.conf.all.rp_filter
          register: rp_filter_check
          changed_when: false

        - name: Confirm IP forwarding status
          assert:
            that:
              - fwd_check.stdout == '1'
              - rp_filter_check.stdout == '0'
            fail_msg: "IP forwarding or RP filter not properly configured"
            success_msg: " IP forwarding enabled, RP filter disabled"
      tags: [forwarding, sysctl]

    # --------------------------------------------------------------------------
    # Step 4: iptables Rules
    # --------------------------------------------------------------------------
    - name: 'Step 4 - iptables Forwarding Rules (mode: "{{ routing_mode }}")'
      block:
        - name: Flush existing filter table rules
          ansible.builtin.iptables:
            table: filter
            flush: yes

        - name: Flush existing nat table rules
          ansible.builtin.iptables:
            table: nat
            flush: yes

        - name: Set default FORWARD policy to DROP
          ansible.builtin.iptables:
            chain: FORWARD
            policy: DROP

        - name: Add FORWARD rule for LAN to WAN
          ansible.builtin.iptables:
            chain: FORWARD
            in_interface: "{{ lan_iface }}"
            out_interface: "{{ wan_iface }}"
            source: "{{ lan_subnet }}"
            jump: ACCEPT
            comment: "Forward LAN to WAN"

        - name: Add FORWARD rule for established/related WAN to LAN traffic
          ansible.builtin.iptables:
            chain: FORWARD
            in_interface: "{{ wan_iface }}"
            out_interface: "{{ lan_iface }}"
            destination: "{{ lan_subnet }}"
            match: state
            ctstate: ESTABLISHED,RELATED
            jump: ACCEPT
            comment: "Return traffic from WAN to LAN"

        - name: Add NAT MASQUERADE rule (only in NAT mode)
          ansible.builtin.iptables:
            table: nat
            chain: POSTROUTING
            source: "{{ lan_subnet }}"
            out_interface: "{{ wan_iface }}"
            jump: MASQUERADE
            comment: "NAT for LAN to WAN"
          when: routing_mode == "nat"

        - name: Display routing mode NAT status
          debug:
            msg: "Mode={{ routing_mode }}: {{ 'MASQUERADE added' if routing_mode == 'nat' else 'Skipping MASQUERADE — pure IP forwarding only' }}"

        - name: Save iptables rules for persistence
          ansible.builtin.command: netfilter-persistent save
          register: iptables_save
          changed_when: iptables_save.rc == 0

        - name: Display FORWARD chain rules
          ansible.builtin.command: iptables -L FORWARD -n -v --line-numbers
          register: forward_rules
          changed_when: false

        - name: Show FORWARD chain
          debug:
            msg: "{{ forward_rules.stdout_lines }}"

        - name: Display NAT POSTROUTING rules
          ansible.builtin.command: iptables -t nat -L POSTROUTING -n -v
          register: nat_rules
          changed_when: false

        - name: Show NAT rules
          debug:
            msg: "{{ nat_rules.stdout_lines }}"
      tags: [iptables, firewall, nat]

    # --------------------------------------------------------------------------
    # Step 5: ISC DHCP Server Configuration
    # --------------------------------------------------------------------------
    - name: Step 5 - ISC DHCP Server Configuration
      block:
        - name: Backup existing dhcpd.conf if it exists
          ansible.builtin.copy:
            src: "{{ dhcp_conf }}"
            dest: "{{ dhcp_conf }}.bak.{{ ansible_date_time.epoch }}"
            remote_src: yes
            backup: yes
          register: dhcp_backup
          failed_when: false

        - name: Clean existing DHCP interface declarations
          ansible.builtin.replace:
            path: "{{ dhcp_defaults }}"
            regexp: '(?m)^INTERFACESv[46]=.*\n?'
            replace: ''
          failed_when: false

        - name: Configure DHCP listening interface
          ansible.builtin.lineinfile:
            path: "{{ dhcp_defaults }}"
            line: 'INTERFACESv4="{{ lan_iface }}"'
            insertafter: EOF
            create: yes

        - name: Disable DHCP IPv6
          ansible.builtin.lineinfile:
            path: "{{ dhcp_defaults }}"
            line: 'INTERFACESv6=""'
            insertafter: EOF
            create: yes

        - name: Write DHCP scope configuration
          ansible.builtin.copy:
            dest: "{{ dhcp_conf }}"
            mode: '0644'
            content: |
              # Generated by Ansible gateway_setup_playbook.yaml - {{ ansible_date_time.iso8601 }}
              # DHCP server for LAN interface: {{ lan_iface }}
              # Routing mode: {{ routing_mode }}
              
              default-lease-time {{ dhcp_lease_default }};
              max-lease-time {{ dhcp_lease_max }};
              authoritative;
              
              subnet {{ lan_network }} netmask {{ lan_netmask }} {
                  range {{ dhcp_range_start }} {{ dhcp_range_end }};
                  option routers {{ lan_ip }};
                  option domain-name-servers {{ dns_primary }}, {{ dns_secondary }};
                  option broadcast-address {{ lan_network | ansible.utils.nthhost(255) }};
              }
              
              # Add static host reservations below this line:
              # host example-device {
              #     hardware ethernet AA:BB:CC:DD:EE:FF;
              #     fixed-address 10.10.10.10;
              # }

        - name: Validate DHCP configuration syntax
          ansible.builtin.command: dhcpd -t -cf {{ dhcp_conf }}
          register: dhcp_configtest
          changed_when: false

        - name: Enable and restart isc-dhcp-server
          ansible.builtin.systemd:
            name: isc-dhcp-server
            enabled: yes
            state: restarted
            daemon_reload: yes

        - name: Wait for DHCP service to stabilize
          ansible.builtin.pause:
            seconds: 3

        - name: Check DHCP service status
          ansible.builtin.systemd:
            name: isc-dhcp-server
          register: dhcp_status

        - name: Verify DHCP service is running
          assert:
            that:
              - dhcp_status.status.ActiveState == 'active'
            fail_msg: "isc-dhcp-server is not active"
            success_msg: " isc-dhcp-server is active and running"

        - name: Display DHCP server status
          ansible.builtin.command: systemctl status isc-dhcp-server --no-pager -l
          register: dhcp_service_status
          changed_when: false

        - name: Show DHCP service status
          debug:
            msg: "{{ dhcp_service_status.stdout_lines }}"
      tags: [dhcp]

    # --------------------------------------------------------------------------
    # Step 6: Deploy custom MOTD header
    # --------------------------------------------------------------------------
    - name: Step 6 - Deploy custom MOTD header
      block:
        - name: Check if MOTD backup already exists
          ansible.builtin.stat:
            path: "{{ motd_backup }}"
          register: backup_stat

        - name: Backup existing MOTD header
          ansible.builtin.copy:
            src: "{{ motd_target }}"
            dest: "{{ motd_backup }}"
            remote_src: true
            owner: root
            group: root
            mode: "0755"
          when:
            - not backup_stat.stat.exists
            - motd_source is file

        - name: Deploy new MOTD header
          ansible.builtin.copy:
            src: "{{ motd_source }}"
            dest: "{{ motd_target }}"
            owner: root
            group: root
            mode: "0755"
          when: motd_source is file
      tags: [motd]

  # ============================================================================
  # POST_TASKS - Verification and next steps
  # ============================================================================
  post_tasks:
    - name: Verification Summary
      block:
        - name: Collect verification data
          ansible.builtin.shell: |
            echo "ip_forward:$(sysctl -n net.ipv4.ip_forward)"
            echo "rp_filter:$(sysctl -n net.ipv4.conf.all.rp_filter)"
            echo "lan_ip:$(ip -4 addr show {{ lan_iface }} 2>/dev/null | awk '/inet / {print $2}' | head -1)"
            echo "nat_count:$(iptables -t nat -L POSTROUTING -n 2>/dev/null | grep -c 'MASQUERADE' || echo 0)"
            echo "forward_policy:$(iptables -L FORWARD 2>/dev/null | head -1 | awk '{print $4}' | tr -d ')')"
            echo "dhcp_status:$(systemctl is-active isc-dhcp-server 2>/dev/null || echo inactive)"
            echo "sysctl_file:$(test -f {{ sysctl_file }} && echo exists || echo missing)"
            echo "iptables_save:$(test -f /etc/iptables/rules.v4 && echo exists || echo missing)"
          register: verify_data
          changed_when: false

        - name: Parse verification data
          set_fact:
            verify_results: >-
              {{
                dict(
                  verify_data.stdout_lines
                  | select('match', '^[^:]+:')
                  | map('split', ':', 1)
                  | list
                )
              }}

        - name: Display verification summary
          debug:
            msg:
              - ""
              - "══════════════════════════════════════════"
              - "  Verification Summary (mode: {{ routing_mode }})"
              - "══════════════════════════════════════════"
              - "  ✓ IP forwarding enabled: {{ '✓' if verify_results.ip_forward == '1' else '✗' }}"
              - "  ✓ RP filter disabled: {{ '✓' if verify_results.rp_filter == '0' else '✗' }}"
              - "  ✓ LAN IP {{ lan_cidr }}: {{ '✓' if verify_results.lan_ip == lan_cidr else '✗' }}"
              - "  {% if routing_mode == 'nat' %}✓ NAT MASQUERADE: {{ '✓' if verify_results.nat_count | int >= 1 else '✗' }}{% else %}✓ No NAT (route mode): {{ '✓' if verify_results.nat_count | int == 0 else '✗' }}{% endif %}"
              - "  ✓ FORWARD policy DROP: {{ '✓' if verify_results.forward_policy == 'DROP' else '✗' }}"
              - "  ✓ DHCP server active: {{ '✓' if verify_results.dhcp_status == 'active' else '✗' }}"
              - "  ✓ Sysctl file: {{ '✓' if verify_results.sysctl_file == 'exists' else '✗' }}"
              - "  ✓ iptables persistence: {{ '✓' if verify_results.iptables_save == 'exists' else '✗' }}"
              - ""


    - name: Print Next Steps
      ansible.builtin.debug:
        msg: >-
          {{
            [
              '',
              '╔══════════════════════════════════════════════════════════════════╗',
              '║                  Setup Complete — Next Steps                     ║',
              '╚══════════════════════════════════════════════════════════════════╝',
              ''
            ]
            + (
              [
                '  ⚠  ROUTING MODE — upstream static route required!',
                '',
                '  On the upstream router or Kali attacker machine, add a return route:',
                '    sudo ip route add ' + lan_subnet + ' via <gateway-WAN-IP>',
                '',
                '  To make it persistent on Kali (Netplan):',
                '    Add to /etc/netplan/01-netcfg.yaml under the relevant interface:',
                '      routes:',
                '        - to: ' + lan_subnet,
                '          via: <gateway-WAN-IP>',
                '',
                '  Verify end-to-end routing WITHOUT NAT:',
                '    # On a LAN client (e.g. second host on ' + lan_iface + '):',
                '    sudo dhclient -v eth0',
                '    ip addr show eth0              # Expect ' + dhcp_range_start + '–' + dhcp_range_end,
                '    ip route                       # Expect default via ' + lan_ip,
                '    ping -c 4 ' + lan_ip + '       # Reach gateway',
                '    ping -c 4 <upstream-IP>        # Reach upstream (no NAT)',
                '',
                '  Confirm no MASQUERADE is active:',
                '    sudo iptables -t nat -L POSTROUTING -n -v   # Should show no MASQUERADE'
              ] if routing_mode == 'route' else [
                '  NAT MODE — connect a client to ' + lan_iface + ' and verify:',
                '',
                '  On client (e.g. Kali Linux):',
                '    sudo dhclient -v eth0           # Request DHCP lease',
                '    ip addr show eth0               # Confirm address in ' + dhcp_range_start + '–' + dhcp_range_end,
                '    ip route                        # Confirm default via ' + lan_ip,
                '    ping -c 4 ' + lan_ip + '        # Reach the gateway',
                '    ping -c 4 8.8.8.8              # Reach internet through NAT',
                '    curl -s https://ifconfig.me    # Confirm external IP (= gateway WAN IP)'
              ]
            )
            + [
              '',
              '  ────────────────────────────────────────────────────────────────',
              '',
              '  On the gateway (monitor DHCP leases):',
              '    sudo journalctl -u isc-dhcp-server -f',
              '',
              '  To switch between modes:',
              '    Edit routing_mode in the playbook vars and re-run, or manually:',
              '      NAT on:  sudo iptables -t nat -A POSTROUTING -s ' + lan_subnet + ' -o ' + wan_iface + ' -j MASQUERADE',
              '      NAT off: sudo iptables -t nat -D POSTROUTING -s ' + lan_subnet + ' -o ' + wan_iface + ' -j MASQUERADE',
              '',
              '  To add a static DHCP reservation:',
              '    Edit ' + dhcp_conf + ' and add:',
              '      host <hostname> {',
              '          hardware ethernet <MAC_ADDRESS>;',
              '          fixed-address <DESIRED_IP>;',
              '      }',
              '    Then: sudo systemctl restart isc-dhcp-server',
              '',
              '  Useful diagnostics:',
              '    ip addr && ip route             # Interface and routing state',
              '    sudo iptables -L -n -v          # Filter rules',
              '    sudo iptables -t nat -L -n -v   # NAT rules',
              '    sudo systemctl status isc-dhcp-server',
              '    sysctl net.ipv4.ip_forward',
              '    sysctl net.ipv4.conf.all.rp_filter',
              '',
              '  When ready to install Suricata IPS, run the IPS setup playbook.',
              ''
            ]
          }}
    