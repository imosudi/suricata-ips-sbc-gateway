# playbook: gateway_setup_playbook.yaml
---
# gateway_setup_playbook.yaml
# Ansible playbook for Gateway System Setup
# SBC: Single Board Computer - Orange Pi / Ubuntu 24.04 LTS / Debian 12
# Mosudi I.O, FH Technikum Wien - IT Security Lab 2026
#
# Usage:
#   ansible-playbook -K gateway_setup_playbook.yaml
#   or with custom vars:
#   ansible-playbook -K gateway_setup_playbook.yaml -e "lan_ip=10.10.10.1 wifi_ssid=MySSID"
#
# What this playbook does:
#   1. System update & core package installation
#   2. Netplan static LAN / DHCP WAN configuration
#   3. IP forwarding (runtime + persistent)
#   4. iptables NAT + FORWARD rules + persistence
#   5. ISC DHCP server configuration and startup
#   6. Custom MOTD deployment

- name: Gateway System Setup for SBC (Raspberry Pi/Orange Pi)
  hosts: all
  become: yes
  gather_facts: yes
  
  

  pre_tasks:
    - name: Pre-flight checks - Verify running as root
      assert:
        that:
          - ansible_user_id == 'root'
        fail_msg: "This playbook must be run as root. Use -K (--ask-become-pass) option."
        success_msg: "Running with proper privileges"

    - name: Pre-flight checks - Verify LAN interface exists
      ansible.builtin.shell: ip link show {{ lan_iface }} &>/dev/null
      register: lan_iface_check
      failed_when: false
      changed_when: false
    
    - name: Pre-flight checks - LAN interface check result
      assert:
        that:
          - lan_iface_check.rc == 0
        fail_msg: "LAN interface '{{ lan_iface }}' not found. Check configuration."
        success_msg: "LAN interface {{ lan_iface }} found"

    - name: Pre-flight checks - Display OS information
      debug:
        msg: "OS: {{ ansible_distribution }} {{ ansible_distribution_version }} ({{ ansible_architecture }})"

    - name: Copy .env to remote
      copy:
        src: ../.env
        dest: /tmp/.env

    - name: Load .env file
      ansible.builtin.slurp:
        #src: "{{ playbook_dir }}/.env"
        src: /tmp/.env
      register: env_file
      ignore_errors: yes
    
    - name: Parse .env file (robust)
      set_fact:
        env_vars: >-
          {{
            dict(
              env_file.content | b64decode
              | regex_replace('\r\n', '\n')
              | split('\n')
              | select('match', '^[A-Za-z_][A-Za-z0-9_]*=.*$')
              | map('split', '=', 1)
              | list
            )
          }}
    
    - name: Set Wi-Fi variables from .env
      set_fact:
        wifi_ssid: "{{ env_vars.WIFI_SSID | default(wifi_ssid) }}"
        wifi_password: "{{ env_vars.WIFI_PASSWORD | default(wifi_password) }}"
      when: env_file is not failed
      no_log: true

  tasks:
    - name: Bootstrap DNS (temporary resolv.conf)
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: |
          nameserver 9.9.9.9
          nameserver 1.1.1.1
        mode: '0644'

    - name: Step 1 - System Update & Package Installation
      block:
        - name: Update package lists
          ansible.builtin.apt:
            update_cache: yes
            cache_valid_time: 3600
        
        - name: Upgrade installed packages
          ansible.builtin.apt:
            upgrade: dist
            force_apt_get: yes
        
        - name: Remove unused packages
          ansible.builtin.apt:
            autoremove: yes
            purge: yes
        
        - name: Install core networking packages
          ansible.builtin.apt:
            name: "{{ required_packages }}"
            state: present
            force_apt_get: yes
    
    - name: Step 2 - Netplan Network Configuration
      block:
        - name: Remove conflicting Netplan files
          ansible.builtin.find:
            paths: /etc/netplan/
            patterns: "*.yaml"
            excludes: "{{ netplan_file | basename }}"
          register: netplan_files
        
        - name: Archive conflicting Netplan files
          ansible.builtin.copy:
            src: "{{ item.path }}"
            dest: "{{ item.path }}.disabled"
            remote_src: yes
            backup: yes
          loop: "{{ netplan_files.files }}"
          when: netplan_files.files | length > 0
        
        - name: Write Netplan configuration
          ansible.builtin.copy:
            dest: "{{ netplan_file }}"
            mode: '0600'
            content: |
              # Generated by Ansible gateway_setup_playbook.yaml - {{ ansible_date_time.iso8601 }}
              # LAN: {{ lan_iface }}  WAN: {{ wan_iface }}
              network:
                version: 2
                renderer: networkd
              
                ethernets:
                  {{ lan_iface }}:
                    dhcp4: no
                    addresses:
                      - {{ lan_cidr }}
              
                wifis:
                  {{ wan_iface }}:
                    dhcp4: yes
                    access-points:
                      "{{ wifi_ssid }}":
                        password: "{{ wifi_password }}"
        
        - name: Apply Netplan configuration
          ansible.builtin.command: netplan apply
          register: netplan_apply
          changed_when: netplan_apply.rc == 0
        
        - name: Wait for interfaces to stabilize
          ansible.builtin.pause:
            seconds: 3

        - name: Ensure LAN interface is administratively up
          ansible.builtin.command: ip link set {{ lan_iface }} up
          changed_when: false

        - name: Ensure LAN interface has expected IPv4 address
          ansible.builtin.command: ip addr replace {{ lan_cidr }} dev {{ lan_iface }}
          changed_when: false
        
        - name: Verify LAN interface address
          ansible.builtin.shell: ip -4 addr show {{ lan_iface }} | awk '/inet / {print $2}'
          register: lan_addr_check
          changed_when: false

        - name: Assert LAN interface address is configured
          assert:
            that:
              - lan_addr_check.stdout == lan_cidr
            fail_msg: >-
              {{ lan_iface }} does not have {{ lan_cidr }} after netplan apply.
              Current IPv4 addresses: {{ lan_addr_check.stdout | default('none', true) }}.
              DHCP cannot start until the listening interface has an IPv4 address
              in the configured subnet.
            success_msg: "{{ lan_iface }} has expected address {{ lan_cidr }}"
        
        - name: Display LAN interface address
          debug:
            msg: "{{ lan_iface }} assigned {{ lan_addr_check.stdout }} (expected {{ lan_cidr }})"
        
        - name: Display current routing table
          ansible.builtin.command: ip route
          register: routing_table
          changed_when: false
        
        - name: Show routing table
          debug:
            msg: "{{ routing_table.stdout_lines }}"
    
    - name: Step 3 - IP Forwarding
      block:
        - name: Write persistent sysctl rule
          ansible.builtin.copy:
            dest: "{{ sysctl_file }}"
            mode: '0644'
            content: |
              # Generated by Ansible gateway_setup_playbook.yaml - {{ ansible_date_time.iso8601 }}
              net.ipv4.ip_forward=1
        
        - name: Apply sysctl settings
          ansible.builtin.command: sysctl -p {{ sysctl_file }}
          register: sysctl_apply
          changed_when: sysctl_apply.rc == 0
        
        - name: Verify IP forwarding is enabled
          ansible.builtin.shell: sysctl -n net.ipv4.ip_forward
          register: fwd_check
          changed_when: false
        
        - name: Confirm IP forwarding status
          assert:
            that:
              - fwd_check.stdout == '1'
            fail_msg: "IP forwarding NOT enabled - check {{ sysctl_file }}"
            success_msg: "IP forwarding enabled (net.ipv4.ip_forward = 1)"
    
    - name: Step 4 - iptables NAT + Forwarding Rules
      block:
        - name: Flush existing filter table rules
          ansible.builtin.iptables:
            table: filter
            flush: yes
        
        - name: Flush existing nat table rules
          ansible.builtin.iptables:
            table: nat
            flush: yes
        
        - name: Set default FORWARD policy to DROP
          ansible.builtin.iptables:
            chain: FORWARD
            policy: DROP
        
        - name: Add NAT MASQUERADE rule for LAN subnet to WAN
          ansible.builtin.iptables:
            table: nat
            chain: POSTROUTING
            source: "{{ lan_subnet }}"
            out_interface: "{{ wan_iface }}"
            jump: MASQUERADE
            comment: "NAT for LAN to WAN"
        
        - name: Add FORWARD rule for LAN to WAN
          ansible.builtin.iptables:
            chain: FORWARD
            in_interface: "{{ lan_iface }}"
            out_interface: "{{ wan_iface }}"
            jump: ACCEPT
            comment: "Forward LAN to WAN"
        
        - name: Add FORWARD rule for established/related WAN to LAN traffic
          ansible.builtin.iptables:
            chain: FORWARD
            in_interface: "{{ wan_iface }}"
            out_interface: "{{ lan_iface }}"
            match: state
            ctstate: ESTABLISHED,RELATED
            jump: ACCEPT
            comment: "Return traffic from WAN to LAN"
        
        - name: Save iptables rules for persistence
          ansible.builtin.command: netfilter-persistent save
          register: iptables_save
          changed_when: iptables_save.rc == 0
        
        - name: Display FORWARD chain rules
          ansible.builtin.command: iptables -L FORWARD -n -v --line-numbers
          register: forward_rules
          changed_when: false
        
        - name: Show FORWARD chain
          debug:
            msg: "{{ forward_rules.stdout_lines }}"
        
        - name: Display NAT POSTROUTING rules
          ansible.builtin.command: iptables -t nat -L POSTROUTING -n -v
          register: nat_rules
          changed_when: false
        
        - name: Show NAT rules
          debug:
            msg: "{{ nat_rules.stdout_lines }}"
    
    - name: Step 5 - ISC DHCP Server Configuration
      block:
        - name: Backup existing dhcpd.conf if it exists
          ansible.builtin.copy:
            src: "{{ dhcp_conf }}"
            dest: "{{ dhcp_conf }}.bak.{{ ansible_date_time.epoch }}"
            remote_src: yes
            backup: yes
          register: dhcp_backup
          failed_when: false

        - name: Remove duplicate DHCP IPv4 interface declarations
          ansible.builtin.replace:
            path: "{{ dhcp_defaults }}"
            regexp: '(?m)^INTERFACESv4=.*\n?'
            replace: ''
          failed_when: false

        - name: Remove duplicate DHCP IPv6 interface declarations
          ansible.builtin.replace:
            path: "{{ dhcp_defaults }}"
            regexp: '(?m)^INTERFACESv6=.*\n?'
            replace: ''
          failed_when: false
        
        - name: Configure DHCP listening interface
          ansible.builtin.lineinfile:
            path: "{{ dhcp_defaults }}"
            regexp: '^INTERFACESv4='
            line: 'INTERFACESv4="{{ lan_iface }}"'
            create: yes
        
        - name: Disable DHCP IPv6
          ansible.builtin.lineinfile:
            path: "{{ dhcp_defaults }}"
            regexp: '^INTERFACESv6='
            line: 'INTERFACESv6=""'
            create: yes
        
        - name: Write DHCP scope configuration
          ansible.builtin.copy:
            dest: "{{ dhcp_conf }}"
            mode: '0644'
            content: |
              # Generated by Ansible gateway_setup_playbook.yaml - {{ ansible_date_time.iso8601 }}
              # DHCP server for LAN interface: {{ lan_iface }}
              
              default-lease-time {{ dhcp_lease_default }};
              max-lease-time {{ dhcp_lease_max }};
              authoritative;
              
              subnet {{ lan_network }} netmask {{ lan_netmask }} {
                  range {{ dhcp_range_start }} {{ dhcp_range_end }};
                  option routers {{ lan_ip }};
                  option domain-name-servers {{ dns_primary }}, {{ dns_secondary }};
                  option broadcast-address {{ lan_network | ansible.utils.nthhost(255) }};
              }
              
              # Add static host reservations below this line:
              # host example-device {
              #     hardware ethernet AA:BB:CC:DD:EE:FF;
              #     fixed-address 10.10.10.10;
              # }

        - name: Validate DHCP configuration syntax
          ansible.builtin.command: dhcpd -t -cf {{ dhcp_conf }}
          register: dhcp_configtest
          changed_when: false
        
        - name: Enable and start isc-dhcp-server
          ansible.builtin.systemd:
            name: isc-dhcp-server
            enabled: yes
            state: restarted
            daemon_reload: yes
        
        - name: Wait for DHCP service to stabilize
          ansible.builtin.pause:
            seconds: 3
        
        - name: Check DHCP service status
          ansible.builtin.systemd:
            name: isc-dhcp-server
          register: dhcp_status
        
        - name: Verify DHCP service is running
          assert:
            that:
              - dhcp_status.status.ActiveState == 'active'
            fail_msg: "isc-dhcp-server is not active; collecting diagnostics in the next tasks."
            success_msg: "isc-dhcp-server is active and running"
          ignore_errors: yes
          register: dhcp_active_assert

        - name: Collect DHCP service diagnostics
          ansible.builtin.command: systemctl status isc-dhcp-server --no-pager -l
          register: dhcp_failure_status
          changed_when: false
          failed_when: false
          when: dhcp_active_assert is failed

        - name: Collect DHCP journal diagnostics
          ansible.builtin.command: journalctl -u isc-dhcp-server -n 40 --no-pager
          register: dhcp_failure_journal
          changed_when: false
          failed_when: false
          when: dhcp_active_assert is failed

        - name: Collect LAN interface diagnostics
          ansible.builtin.command: ip -br addr show {{ lan_iface }}
          register: dhcp_failure_iface
          changed_when: false
          failed_when: false
          when: dhcp_active_assert is failed

        - name: Fail with DHCP diagnostics
          ansible.builtin.fail:
            msg:
              - "isc-dhcp-server failed to start."
              - "Interface: {{ dhcp_failure_iface.stdout | default('unavailable') }}"
              - "systemctl status:"
              - "{{ dhcp_failure_status.stdout_lines | default([]) }}"
              - "journalctl:"
              - "{{ dhcp_failure_journal.stdout_lines | default([]) }}"
          when: dhcp_active_assert is failed
        
        - name: Display DHCP server status
          ansible.builtin.command: systemctl status isc-dhcp-server --no-pager -l
          register: dhcp_service_status
          changed_when: false
        
        - name: Show DHCP service status
          debug:
            msg: "{{ dhcp_service_status.stdout_lines }}"
    
    - name: Step 6 - Deploy custom MOTD header
      block:
        - name: Check if backup already exists
          ansible.builtin.stat:
            path: "{{ motd_backup }}"
          register: backup_stat
    
        - name: Backup existing MOTD header (only if backup does not exist)
          ansible.builtin.copy:
            src: "{{ motd_target }}"
            dest: "{{ motd_backup }}"
            remote_src: true
            owner: root
            group: root
            mode: "0755"
          when:
            - not backup_stat.stat.exists
          register: backup_result
    
        - name: Report backup status
          ansible.builtin.debug:
            msg: >-
              {{
                'Backup created: ' + motd_backup
                if backup_result is changed
                else 'Backup already exists — skipped'
              }}
    
        - name: Deploy new MOTD header from motd.txt
          ansible.builtin.copy:
            src: "{{ motd_source }}"
            dest: "{{ motd_target }}"
            owner: root
            group: root
            mode: "0755"
          register: motd_deploy_result
    
        - name: Report MOTD deployment status
          ansible.builtin.debug:
            msg: >-
              {{
                'MOTD deployed: ' + motd_target
                if motd_deploy_result is changed
                else 'MOTD already deployed — skipped'
              }}
    
    - name: Verification Summary
      block:
        - name: Check IP forwarding status
          ansible.builtin.shell: sysctl -n net.ipv4.ip_forward
          register: verify_fwd
          
        - name: Check LAN IP assignment
          ansible.builtin.shell: ip -4 addr show {{ lan_iface }} 2>/dev/null | awk '/inet / {print $2}' | head -1
          register: verify_lan_ip
          
        - name: Check NAT rule presence
          ansible.builtin.shell: iptables -t nat -L POSTROUTING -n | grep -c "MASQUERADE" || true
          register: verify_nat
          
        - name: Check FORWARD policy
          ansible.builtin.shell: iptables -L FORWARD | head -1 | awk '{print $4}' | tr -d ')'
          register: verify_forward_policy
          
        - name: Check DHCP service
          ansible.builtin.systemd:
            name: isc-dhcp-server
          register: verify_dhcp
          
        - name: Check sysctl file existence
          ansible.builtin.stat:
            path: "{{ sysctl_file }}"
          register: verify_sysctl
          
        - name: Check iptables rules file existence
          ansible.builtin.stat:
            path: /etc/iptables/rules.v4
          register: verify_iptables_save
          
        - name: Display verification results
          debug:
            msg:
              - "Verification Summary:"
              - "  IP forwarding enabled: {{ '✓' if verify_fwd.stdout == '1' else '✗' }} (got: {{ verify_fwd.stdout }}, expected: 1)"
              - "  LAN IP {{ lan_cidr }} on {{ lan_iface }}: {{ '✓' if verify_lan_ip.stdout == lan_cidr else '✗' }} (got: {{ verify_lan_ip.stdout }}, expected: {{ lan_cidr }})"
              - "  NAT MASQUERADE rule present: {{ '✓' if verify_nat.stdout | int >= 1 else '✗' }} (count: {{ verify_nat.stdout }})"
              - "  FORWARD default policy DROP: {{ '✓' if verify_forward_policy.stdout == 'DROP' else '✗' }} (got: {{ verify_forward_policy.stdout }}, expected: DROP)"
              - "  isc-dhcp-server running: {{ '✓' if verify_dhcp.status.ActiveState == 'active' else '✗' }} (status: {{ verify_dhcp.status.ActiveState }})"
              - "  Sysctl file exists ({{ sysctl_file }}): {{ '✓' if verify_sysctl.stat.exists else '✗' }}"
              - "  iptables rules file exists: {{ '✓' if verify_iptables_save.stat.exists else '✗' }}"
    
  post_tasks:
    - name: Print Next Steps
      debug:
        msg:
          - ""
          - "══════════════════════════════════════════"
          - "  Setup Complete - Next Steps"
          - "══════════════════════════════════════════"
          - ""
          - "Gateway is configured. Connect a client to {{ lan_iface }} and verify:"
          - ""
          - "On client (e.g. Kali Linux):"
          - "  sudo dhclient -v eth0          # Request DHCP lease"
          - "  ip addr show eth0              # Confirm address in {{ dhcp_range_start }}–{{ dhcp_range_end }}"
          - "  ip route                       # Confirm default via {{ lan_ip }}"
          - "  ping -c 4 {{ lan_ip }}         # Reach the gateway"
          - "  ping -c 4 8.8.8.8              # Reach internet through NAT"
          - "  curl -s https://ifconfig.me    # Confirm external IP"
          - ""
          - "On SBC (monitor DHCP leases):"
          - "  sudo journalctl -u isc-dhcp-server -f"
          - ""
          - "To add a static DHCP reservation:"
          - "  Edit {{ dhcp_conf }} and add:"
          - "    host <hostname> {"
          - "        hardware ethernet <MAC_ADDRESS>;"
          - "        fixed-address <DESIRED_IP>;"
          - "    }"
          - "  Then: sudo systemctl restart isc-dhcp-server"
          - ""
          - "Useful diagnostics:"
          - "  ip addr && ip route             # Interface and routing state"
          - "  sudo iptables -L -n -v          # Filter rules"
          - "  sudo iptables -t nat -L -n -v   # NAT rules"
          - "  sudo systemctl status isc-dhcp-server"
          - "  sysctl net.ipv4.ip_forward"
          - ""
          - "To install Suricata IPS, run the IPS setup playbook."
          - ""

