---
# suricata_setup_playbook.yaml
# Ansible playbook for Suricata IPS Setup
# Orange Pi 5 / Ubuntu 24.04 LTS - NFQueue Inline Mode
# Mosudi I.O, FH Technikum Wien - IT Security Lab 2026
#
# Prerequisites:
#   - gateway_setup_playbook.yaml must have been run successfully first
#   - eth0 = LAN (10.10.10.1/24), wlan0 = WAN
#
# Usage:
#   ansible-playbook -K -i inventory.yaml suricata_setup_playbook.yaml
#   or with custom vars:
#   ansible-playbook -K -i inventory.yaml suricata_setup_playbook.yaml -e "lan_subnet=10.10.10.0/24"
# What this playbook does:
#   1. Installs Suricata and dependencies
#   2. Configures Suricata for NFQueue inline mode
#   3. Sets up iptables rules to direct traffic to NFQueue
#   4. Creates a systemd override to run Suricata in NFQueue mode
#   5. Validates configuration and starts the Suricata service
#   6. Provides post-setup instructions for testing and rule management
#


- name: Suricata IPS Setup (NFQueue Inline Mode)
  hosts: all
  become: yes
  gather_facts: yes

  
  pre_tasks:
    - name: Ensure running as root
      assert:
        that: ansible_user_id == "root"
        fail_msg: "This playbook must be run as root. Use -K flag."

    - name: Check IP forwarding is enabled
      command: sysctl -n net.ipv4.ip_forward
      register: ip_forward_check
      changed_when: false

    - name: Verify IP forwarding
      assert:
        that: ip_forward_check.stdout == "1"
        fail_msg: "IP forwarding not enabled. Run gateway_setup_playbook.yaml first."

    - name: Check LAN interface exists
      command: "ip link show {{ lan_iface }}"
      register: lan_check
      changed_when: false
      failed_when: false

    - name: Verify LAN interface
      assert:
        that: lan_check.rc == 0
        fail_msg: "LAN interface {{ lan_iface }} not found"

  tasks:
    # ---------------------------
    # Install Suricata
    # ---------------------------
    - name: Update package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Suricata and dependencies
      apt:
        name:
          - suricata
          - python3-pip
        state: present

    - name: Verify Suricata installation
      command: suricata --build-info
      register: suricata_info
      changed_when: false

    - name: Check NFQueue support
      debug:
        msg: "NFQueue support: {{ 'yes' if 'NFQueue' in suricata_info.stdout else 'no' }}"

    # ---------------------------
    # Create directories
    # ---------------------------
    - name: Ensure Suricata directories exist
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - "{{ suricata_log_dir }}"
        - "{{ suricata_rules_dir }}"

    # ---------------------------
    # Fix rule file issues
    # ---------------------------
    - name: Ensure default rule file exists (empty)
      file:
        path: "{{ default_rules }}"
        state: touch
        mode: '0644'

    - name: Create local.rules with test rule
      copy:
        dest: "{{ local_rules }}"
        mode: '0644'
        content: |
          # Local Suricata Rules
          # SID range: 9000001 - 9000099
          
          # Test rule for ICMP (useful for verification)
          alert icmp any any -> any any (msg:"ICMP traffic detected"; sid:9000001; rev:1;)
          
          # Example: Block SSH brute force (uncomment to enable)
          # drop tcp any any -> any 22 (msg:"SSH connection"; flow:to_server,established; threshold:type both, track by_src, count 5, seconds 60; sid:9000002; rev:1;)

    # ---------------------------
    # Backup original config
    # ---------------------------
    - name: Backup original suricata.yaml
      copy:
        src: "{{ suricata_yaml }}"
        dest: "{{ suricata_yaml_backup }}"
        remote_src: yes
        backup: yes
      failed_when: false

    # ---------------------------
    # Fix HOME_NET configuration
    # ---------------------------
    - name: Set HOME_NET correctly
      replace:
        path: "{{ suricata_yaml }}"
        regexp: '^(\s*)HOME[-_]NET:.*$'
        replace: '\1HOME_NET: "[{{ lan_subnet }}]"'

    # ---------------------------
    # Remove existing NFQ blocks
    # ---------------------------
    - name: Remove any existing NFQ configuration blocks
      blockinfile:
        path: "{{ suricata_yaml }}"
        marker: "# {mark} NFQ CONFIG"
        state: absent

    - name: Remove inline nfq configuration
      replace:
        path: "{{ suricata_yaml }}"
        regexp: '^nfq:.*(?:\n\s+.*)*'
        replace: '# nfq configuration removed - will be re-added'

    # ---------------------------
    # Add clean NFQ configuration
    # ---------------------------
    - name: Insert NFQ configuration block
      blockinfile:
        path: "{{ suricata_yaml }}"
        marker: "# {mark} NFQ CONFIGURATION"
        insertbefore: '^af-packet:'
        block: |
          nfq:
            mode: accept
            repeat-mark: 1
            repeat-mask: 1
            bypass: yes

    # ---------------------------
    # Disable AF_PACKET to avoid conflicts
    # ---------------------------
    - name: Comment out AF_PACKET interface configuration
      replace:
        path: "{{ suricata_yaml }}"
        regexp: '^(\s+-\s+interface:)'
        replace: '# \1'

    # ---------------------------
    # Configure rule files
    # ---------------------------
    - name: Remove broken suricata.rules reference
      replace:
        path: "{{ suricata_yaml }}"
        regexp: '^\s*-\s*suricata\.rules'
        replace: '# - suricata.rules'

    - name: Ensure local.rules is included in rule-files
      lineinfile:
        path: "{{ suricata_yaml }}"
        regexp: '^\s*-\s*local\.rules'
        line: '  - local.rules'
        insertafter: '^rule-files:'
        state: present

    # ---------------------------
    # Validate configuration
    # ---------------------------
    - name: Validate Suricata configuration
      command: "suricata -T -c {{ suricata_yaml }} -v"
      register: config_test
      changed_when: false
      failed_when: false

    - name: Display validation output
      debug:
        msg: "{{ config_test.stdout_lines }}"
      when: config_test.stdout_lines | length > 0

    - name: Fail if configuration is invalid
      fail:
        msg: |
          Suricata configuration validation failed!
          Error: {{ config_test.stderr }}
      when: config_test.rc != 0

    # ---------------------------
    # Configure iptables for NFQUEUE
    # ---------------------------
    - name: Flush existing iptables rules
      iptables:
        table: "{{ item.table }}"
        flush: yes
      loop:
        - { table: 'filter' }
        - { table: 'nat' }

    - name: Add NAT MASQUERADE rule
      iptables:
        table: nat
        chain: POSTROUTING
        out_interface: "{{ wan_iface }}"
        jump: MASQUERADE

    - name: Add ESTABLISHED,RELATED bypass rule (top of chain)
      iptables:
        chain: FORWARD
        action: insert
        rule_num: 1
        match: state
        ctstate: ESTABLISHED,RELATED
        jump: ACCEPT
        comment: "Allow established traffic"

    - name: Add NFQUEUE rule (idempotent)
      command: >
        iptables -C FORWARD -j NFQUEUE --queue-num {{ nfqueue_num }}
      register: nfq_check
      failed_when: false
      changed_when: false

    - name: Insert NFQUEUE rule if missing
      command: >
        iptables -A FORWARD -j NFQUEUE --queue-num {{ nfqueue_num }}
      when: nfq_check.rc != 0

    - name: Save iptables rules
      command: netfilter-persistent save
      register: iptables_save
      changed_when: iptables_save.rc == 0

    # ---------------------------
    # Configure systemd override
    # ---------------------------
    - name: Create systemd override directory
      file:
        path: "{{ systemd_override_dir }}"
        state: directory
        mode: '0755'

    - name: Create systemd override configuration
      copy:
        dest: "{{ systemd_override }}"
        mode: '0644'
        content: |
          # Generated by Ansible suricata_setup_playbook
          [Service]
          ExecStart=
          ExecStart=/usr/bin/suricata -D -q {{ nfqueue_num }} -c {{ suricata_yaml }} --pidfile /run/suricata.pid
          Restart=on-failure
          RestartSec=10

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    # ---------------------------
    # Start Suricata service
    # ---------------------------
    - name: Enable Suricata service
      systemd:
        name: suricata
        enabled: yes

    - name: Start Suricata service
      systemd:
        name: suricata
        state: restarted

    - name: Wait for Suricata to initialise
      pause:
        seconds: 5

    # ---------------------------
    # Verify Suricata is running
    # ---------------------------
    - name: Check Suricata service status
      systemd:
        name: suricata
      register: suricata_status

    - name: Verify Suricata is active
      assert:
        that:
          - suricata_status.status.ActiveState == "active"
          - suricata_status.status.SubState == "running"
        fail_msg: "Suricata service is not running. Check logs with: journalctl -u suricata"

    - name: Check Suricata process
      command: "pgrep -f 'suricata.*-q {{ nfqueue_num }}'"
      register: suricata_pid
      changed_when: false
      failed_when: false

    - name: Display Suricata PID
      debug:
        msg: "Suricata running with PID: {{ suricata_pid.stdout }}"
      when: suricata_pid.rc == 0

    # ---------------------------
    # Display iptables rules
    # ---------------------------
    - name: Show FORWARD chain rules
      command: iptables -L FORWARD -n -v --line-numbers
      register: forward_rules
      changed_when: false

    - name: Display FORWARD chain
      debug:
        msg: "{{ forward_rules.stdout_lines }}"

  post_tasks:
    - name: Print completion message
      debug:
        msg:
          - ""
          - "══════════════════════════════════════════"
          - "  Suricata IPS Setup Complete!"
          - "══════════════════════════════════════════"
          - ""
          - "Configuration Summary:"
          - "  • LAN Interface: {{ lan_iface }} ({{ lan_subnet }})"
          - "  • WAN Interface: {{ wan_iface }}"
          - "  • NFQueue Number: {{ nfqueue_num }}"
          - "  • Config File: {{ suricata_yaml }}"
          - "  • Rules Directory: {{ suricata_rules_dir }}"
          - "  • Log Directory: {{ suricata_log_dir }}"
          - ""
          - "Verify IPS functionality:"
          - "  • From a client (10.10.10.x): ping 8.8.8.8"
          - "  • Check counter: sudo iptables -L FORWARD -n -v"
          - "  • Monitor alerts: sudo tail -f {{ suricata_log_dir }}/fast.log"
          - ""
          - "Add custom rules:"
          - "  • Edit: sudo vi {{ local_rules }}"
          - "  • Reload: sudo kill -USR2 $(cat /var/run/suricata.pid)"
          - ""
          - "Troubleshooting:"
          - "  • Check logs: sudo journalctl -u suricata -f"
          - "  • Validate config: sudo suricata -T -c {{ suricata_yaml }}"
          - "  • View stats: sudo suricatasc -c \"uptime\""
          - ""
        
      
    
  
