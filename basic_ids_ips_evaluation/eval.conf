# =============================================================================
# config/eval.conf — Suricata Eval Harness Configuration
# Edit all values to match your lab topology before running run_eval.sh
# =============================================================================

# ── Network topology ──────────────────────────────────────────────────────────
GATEWAY_IP="10.10.10.1"          # Orange Pi gateway running Suricata
TARGET_IP="10.10.10.150"         # Protected LAN host (scan/attack target)
KALI_IFACE=""                    # Interface on this Kali machine facing LAN; auto-detected from GATEWAY_IP network
EXTERNAL_IP="example.com"      # example.com — used for HTTP/TLS tests

# ── Gateway SSH access (for alert collection) ─────────────────────────────────
GW_USER=""                       # SSH user on the gateway; sourced from .env ANSIBLE_USER
GW_SSH_KEY="${HOME}/.ssh/id_ed25519_eval"  # SSH key (no passphrase for scripting)

# ── Suricata log paths on gateway ─────────────────────────────────────────────
GW_FAST_LOG="/var/log/suricata/fast.log"
GW_EVE_LOG="/var/log/suricata/eve.json"

# ── Timing ────────────────────────────────────────────────────────────────────
ALERT_SETTLE_SECS=3    # wait after each attack before checking alerts
FLOOD_RATE=200         # hping3 flood rate (packets/sec) for ICMP test
FLOOD_DURATION=5       # seconds to sustain ICMP flood

# ── HTTP test parameters ──────────────────────────────────────────────────────
HTTP_PORT=80
HTTP_TIMEOUT=5         # curl timeout in seconds

# ── Telnet test parameters ─────────────────────────────────────────────────────
TELNET_PORT=23
TELNET_TIMEOUT=5

# ── SID references (for alert matching) ───────────────────────────────────────
# Keep in sync with deployed rule SIDs
SID_ICMP_TIMESTAMP_REQ=9000201
SID_ICMP_TIMESTAMP_REP=9000202
SID_ICMP_FLOOD=9000203
SID_HTTP_EXAMPLE_COM=9000300
SID_HTTP_EXAMPLE_NET=9000301
SID_HTTP_EXAMPLE_ORG=9000302
SID_HTTP_BIGBANG_URI=9000303
SID_HTTP_BIGBANG_BODY=9000304
SID_HTTP_BIGBANG_HDR=9000305
SID_HTTP_BIGBANG_RESP=9000306
SID_HTTP_SQLI=9000310
SID_HTTP_TRAVERSAL=9000311
SID_HTTP_SQLMAP=9000312
SID_HTTP_NIKTO=9000313
SID_TLS_SNI_COM=9000401
SID_TLS_SNI_ORG=9000402
SID_TLS_SNI_NET=9000403
SID_TLS_CERT_COM=9000404
SID_TLS_CERT_ORG=9000405
SID_TLS_CERT_NET=9000406
SID_TLS_DEPRECATED=9000410
SID_TLS_NONSTANDARD=9000411
SID_TELNET_BIGBANG=9000500
SID_TELNET_SESSION=9000501
SID_TELNET_LOGIN=9000502
SID_TELNET_PASSWORD=9000503
