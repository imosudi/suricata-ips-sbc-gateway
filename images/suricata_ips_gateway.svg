<svg width="1200" height="700" viewBox="0 0 1200 700"
     xmlns="http://www.w3.org/2000/svg">

<defs>

<style>
.title {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 28px;
    font-weight: bold;
    fill: #111827;
}

.label {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 18px;
    fill: #111827;
}

.small {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    fill: #4b5563;
}

.box {
    fill: white;
    stroke: #374151;
    stroke-width: 2;
    rx: 12;
}

.gateway {
    fill: #f8fafc;
    stroke: #2563eb;
    stroke-width: 3;
    rx: 16;
}

.module {
    fill: #ffffff;
    stroke: #6b7280;
    stroke-width: 1.5;
    rx: 10;
}

.arrow {
    stroke: #374151;
    stroke-width: 2.5;
    fill: none;
    marker-end: url(#arrow);
}
</style>

<marker id="arrow"
         markerWidth="10"
         markerHeight="10"
         refX="7"
         refY="3"
         orient="auto">
    <path d="M0,0 L0,6 L8,3 z"
          fill="#374151"/>
</marker>

</defs>

<!-- Internet -->
<g>
<ellipse cx="600" cy="110" rx="90" ry="35"
         fill="#eef2ff"
         stroke="#374151"
         stroke-width="2"/>
<text x="600"
      y="117"
      text-anchor="middle"
      class="label">
Internet / WAN
</text>
</g>

<!-- Arrow -->
<line x1="600" y1="145"
      x2="600" y2="210"
      class="arrow"/>

<!-- Gateway -->
<rect x="330"
      y="210"
      width="540"
      height="280"
      class="gateway"/>

<text x="600"
      y="250"
      text-anchor="middle"
      class="label"
      style="font-size:24px;font-weight:bold;">
Single-Board Computer Gateway
</text>

<text x="600"
      y="278"
      text-anchor="middle"
      class="small">
Orange Pi 5 running Ubuntu 22.04 LTS
</text>

<!-- Modules -->

<rect x="390" y="330"
      width="180"
      height="60"
      class="module"/>
<text x="480"
      y="365"
      text-anchor="middle"
      class="label">
LAN/WAN Routing
</text>

<rect x="630" y="330"
      width="180"
      height="60"
      class="module"/>
<text x="720"
      y="365"
      text-anchor="middle"
      class="label">
iptables NFQUEUE
</text>

<rect x="390" y="400"
      width="180"
      height="60"
      class="module"/>
<text x="480"
      y="435"
      text-anchor="middle"
      class="label">
Suricata IDS/IPS
</text>

<rect x="630" y="400"
      width="180"
      height="60"
      class="module"/>
<text x="720"
      y="435"
      text-anchor="middle"
      class="label">
Modular Rule Sets
</text>

<!-- Protected LAN -->
<line x1="600" y1="490"
      x2="600" y2="560"
      class="arrow"/>

<rect x="430"
      y="560"
      width="340"
      height="90"
      class="box"/>

<text x="600"
      y="600"
      text-anchor="middle"
      class="label"
      style="font-size:22px;font-weight:bold;">
Protected LAN
</text>

<text x="600"
      y="630"
      text-anchor="middle"
      class="small">
 IoT Devices / Workstations
</text>

</svg>