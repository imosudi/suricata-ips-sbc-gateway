# inventory.yaml - Ansible inventory file for managing the target host
all:
  hosts:
    #"{{ lookup('ansible.builtin.env', 'TARGET_IP', default='10.160.240.70') }}":
    "{{ lookup('ansible.builtin.env', 'TARGET_IP') }}":
      #ansible_user:  "{{ lookup('ansible.builtin.env', 'ANSIBLE_USER', default='orangepi') }}"
      ansible_user:  "{{ lookup('ansible.builtin.env', 'ANSIBLE_USER') }}"
      ansible_become: yes
      ansible_connection: ssh
      ansible_ssh_private_key_file: "{{ lookup('env', 'ANSIBLE_SSH_KEY') }}"
      ansible_python_interpreter: /usr/bin/python3


  vars:
    # Network config (single source of truth)
    # Network interfaces
    lan_iface: "eth0"
    wan_iface: "wlan0"
    
    #lan_iface: eth0
    #wan_iface: wlan0
    #lan_subnet: 10.10.10.0/24
    #lan_ip: 10.10.10.1

    # DHCP
    #dhcp_range_start: 10.10.10.100
    #dhcp_range_end: 10.10.10.200
    #dhcp_lease_default: 600
    #dhcp_lease_max: 7200

    # DNS
    #dns_primary: 9.9.9.9
    #dns_secondary: 1.1.1.1


    # LAN configuration
    lan_ip: "10.10.10.1"
    lan_cidr: "10.10.10.1/24"
    lan_subnet: "10.10.10.0/24"
    lan_netmask: "255.255.255.0"
    lan_network: "10.10.10.0"
    
    # DHCP Pool configuration
    dhcp_range_start: "10.10.10.100"
    dhcp_range_end: "10.10.10.200"
    dhcp_lease_default: 600
    dhcp_lease_max: 7200
    
    # DNS servers
    dns_primary: "9.9.9.9"
    dns_secondary: "1.1.1.1"
    
    # Security
    trusted_mac: "B4:69:21:75:B0:8E"

    # Wi-Fi configuration
    wifi_ssid: "{{ env_vars.WIFI_SSID | default(lookup('env','WIFI_SSID')) }}"
    #wifi_ssid: "{{ lookup('ansible.builtin.env', 'WIFI_SSID') }}" #, default='Mio4') }}"
    wifi_password: "{{ env_vars.WIFI_PASSWORD | default(lookup('env','WIFI_PASSWORD')) }}" #, default='ceffxpnfax') }}"
    
    # Configuration file paths
    netplan_file: "/etc/netplan/001-gateway.yaml"
    sysctl_file: "/etc/sysctl.d/99-gateway.conf"
    dhcp_defaults: "/etc/default/isc-dhcp-server"
    dhcp_conf: "/etc/dhcp/dhcpd.conf"
    
    # Required packages
    required_packages:
      - vim
      - iproute2
      - net-tools
      - iptables
      - iptables-persistent
      - netfilter-persistent
      - isc-dhcp-server
    
    # Suricata configuration
    nfqueue_num: 0

    suricata_yaml: "/etc/suricata/suricata.yaml"
    suricata_yaml_backup: "/etc/suricata/suricata.yaml.ansible-bak"
    suricata_log_dir: "/var/log/suricata"
    suricata_rules_dir: "/etc/suricata/rules"
    local_rules: "/etc/suricata/rules/local.rules"
    default_rules: "/etc/suricata/rules/suricata.rules"

    systemd_override_dir: "/etc/systemd/system/suricata.service.d"
    systemd_override: "/etc/systemd/system/suricata.service.d/override.conf"
