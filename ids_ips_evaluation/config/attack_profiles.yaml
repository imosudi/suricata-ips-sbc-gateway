# =============================================================================
# attack_profiles.yaml — Named intensity profiles for attack modules
# Select a profile with: ./validation_harness.sh -p <name>
# =============================================================================

profiles:

  light:
    description: "Low-intensity, short-duration — safe for production-adjacent labs"
    duration: 3
    inter_sleep: 3
    modules:
      icmp:  { flood_rate: 100,   packet_count: 50  }
      scan:  { scan_types: [SYN], port_range: "22-443" }
      dns:   { query_count: 20                       }
      ssh:   { attempts: 5,       wordlist: tiny     }
      http:  { request_count: 20, tools: [curl]      }
      tls:   { checks: [version]                     }
      ftp:   { attempts: 5                           }
      smtp:  { relay_attempts: 3                     }
      policy:{ checks: [tor_port]                    }
      benign:{ duration: 10                          }

  full:
    description: "Standard validation suite — default profile"
    duration: 5
    inter_sleep: 2
    modules:
      icmp:  { flood_rate: 1000,  packet_count: 200 }
      scan:  { scan_types: [SYN, NULL, XMAS, version], port_range: "1-1024" }
      dns:   { query_count: 100                      }
      ssh:   { attempts: 20,      wordlist: small    }
      http:  { request_count: 50, tools: [curl, nikto] }
      tls:   { checks: [version, cipher, cert]       }
      ftp:   { attempts: 15                          }
      smtp:  { relay_attempts: 10                    }
      policy:{ checks: [tor_port, p2p_port, irc]     }
      benign:{ duration: 30                          }

  aggressive:
    description: "High-intensity — use only in isolated lab environments"
    duration: 15
    inter_sleep: 1
    modules:
      icmp:  { flood_rate: 10000, packet_count: 5000 }
      scan:  { scan_types: [SYN, NULL, XMAS, FIN, UDP, version, os], port_range: "1-65535" }
      dns:   { query_count: 1000, amplification: true }
      ssh:   { attempts: 100,     wordlist: rockyou  }
      http:  { request_count: 200, tools: [curl, nikto, sqlmap] }
      tls:   { checks: [version, cipher, cert, heartbleed, beast] }
      ftp:   { attempts: 50                          }
      smtp:  { relay_attempts: 30, user_enum: true   }
      policy:{ checks: [tor_port, p2p_port, irc, proxy, covert_channel] }
      benign:{ duration: 60                          }
