# =============================================================================
# scoring.conf — Scoring weights and thresholds
# All WEIGHT_* values must sum to 100.
# =============================================================================

# --- Dimension weights -------------------------------------------------------
WEIGHT_DETECTION=35
WEIGHT_IPS_BLOCK=25
WEIGHT_LATENCY=20
WEIGHT_FALSE_POSITIVE=20

# --- Pass thresholds (minimum score per dimension to pass) -------------------
THRESHOLD_DETECTION=60      # < 60 % detection → dimension fails
THRESHOLD_IPS_BLOCK=50      # IDS mode: this check is skipped
THRESHOLD_LATENCY=70        # latency score (100 = zero degradation)
THRESHOLD_FALSE_POSITIVE=80 # FP score (100 = zero false positives)

# --- Final grade boundaries --------------------------------------------------
GRADE_A=90
GRADE_B=80
GRADE_C=70
GRADE_D=60
# Below GRADE_D → F

# --- Penalty rules -----------------------------------------------------------
# Apply multiplicative penalty if a critical module is not detected at all
CRITICAL_MODULES="ssh,http,scan"
CRITICAL_MISS_PENALTY=0.85   # multiply final score by this if any critical module missed

# --- Bonus rules -------------------------------------------------------------
BENIGN_BONUS_ENABLED=true
BENIGN_BONUS_POINTS=2        # bonus added to FP score if benign traffic is 100 % clean
