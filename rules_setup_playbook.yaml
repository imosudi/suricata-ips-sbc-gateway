---
# =============================================================================
# rules_setup_playbook.yaml
# Suricata Modular Rule Engine Setup
# Orange Pi 5 / Ubuntu 22.04 LTS - NFQueue Inline Mode
# FH Technikum Wien - IT Security Lab 2026
#
# Run:
#   ansible-playbook -i inventory.yaml rules_setup_playbook.yaml
#   ansible-playbook -i inventory.yaml rules_setup_playbook.yaml --tags validate
#   ansible-playbook -i inventory.yaml rules_setup_playbook.yaml --check --diff
#
# Prerequisites:
#   suricata_setup_playbook.yaml must have completed successfully.
#
# What this playbook does:
#   1. Creates modular rule files in /etc/suricata/rules/available based on inventory.yaml config
#   2. Each rule file corresponds to a specific protocol or policy area (e.g., HTTP, DNS, policy enforcement)
#   3. Rules are generated with appropriate actions (alert, drop, pass) based on the mode specified in inventory.yaml
#   4. Provides a clean separation of rule sets for easier management and customization
# Note: This playbook focuses on rule deployment. Enabling/disabling rules and managing symlinks in /etc/suricata/rules/enabled is handled separately.
# =============================================================================

- name: Deploy Suricata Modular Rule Engine
  hosts: all
  become: yes
  gather_facts: yes

 
  tasks:

    # DIRECTORY STRUCTURE AND LOCAL RULES FILE SETUP

    - name: "Step 1 | Ensure Suricata rule directories exist"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ suricata_rules_dir }}"
        - "{{ suricata_rules_avail }}"
        - "{{ suricata_rules_enabled }}"

    - name: "Step 1 | Ensure local.rules file exists"
      ansible.builtin.file:
        path: "{{ local_rules }}"
        state: touch
        mode: "0644"
        modification_time: preserve
        access_time: preserve


    # DEPLOYING RULE MODULES

    - name: "Deploy 10_trusted.rules - Admin bypass"
      when: suricata_rule_modules["10_trusted.rules"]["enabled"] | bool
      ansible.builtin.copy:
        dest: "{{ suricata_rules_avail }}/10_trusted.rules"
        mode: "0644"

        content: |
          # =================================================================
          # 10_trusted.rules - Trusted Admin Device Bypass
          # mode: {{ suricata_rule_modules["10_trusted.rules"].mode | default('bypass') }}
          # =================================================================
          {% set action = 'pass' %}
          {% if trusted_ip is defined and trusted_ip | length > 0 %}
          {{ action }} ip {{ trusted_ip }} any -> any any (msg:"TRUSTED ADMIN IP BYPASS"; sid:9000001; rev:2;)
          {% endif %}
          {% if trusted_mac is defined and trusted_mac | length > 0 %}
          # NOTE: ether src keyword requires AF_PACKET mode.
          # In NFQueue mode use the iptables MAC rule instead.
          # pass ethernet any any -> any any (msg:"TRUSTED MAC BYPASS"; ether src {{ trusted_mac | lower }}; sid:9000002; rev:1;)
          {% endif %}

    - name: "Deploy 20_icmp.rules - ICMP detection"
      when: suricata_rule_modules["20_icmp.rules"]["enabled"] | bool
      ansible.builtin.copy:
        dest: "{{ suricata_rules_avail }}/20_icmp.rules"
        mode: "0644"
        content: |
          # =================================================================
          # 20_icmp.rules - ICMP Detection
          # mode: {{ suricata_rule_modules["20_icmp.rules"].mode | default('ids') }}
          # =================================================================
          {% set action = 'alert' if suricata_rule_modules["20_icmp.rules"].mode | default('ids') == 'ids'
            else 'drop' if suricata_rule_modules["20_icmp.rules"].mode | default('ids') == 'ips'
            else 'pass' %}
          {{ action }} icmp any any -> $HOME_NET any (msg:"ICMP Timestamp Request"; itype:13; sid:9000201; rev:1;)
          {{ action }} icmp any any -> $HOME_NET any (msg:"ICMP Timestamp Reply"; itype:14; sid:9000202; rev:1;)
          {{ action }} icmp any any -> $HOME_NET any (msg:"ICMP Flood"; itype:8; threshold:type both, track by_src, count 50, seconds 5; sid:9000203; rev:1;)

    - name: "Deploy 30_http.rules - HTTP detection"
      when: suricata_rule_modules["30_http.rules"]["enabled"] | bool
      ansible.builtin.copy:
        dest: "{{ suricata_rules_avail }}/30_http.rules"
        mode: "0644"
        content: |
          # =================================================================
          # 30_http.rules - HTTP Detection
          # mode: {{ suricata_rule_modules["30_http.rules"].mode | default('ids') }}
          # =================================================================
          {% set action = 'alert' if suricata_rule_modules["30_http.rules"].mode | default('ids') == 'ids'
            else 'drop' if suricata_rule_modules["30_http.rules"].mode | default('ids') == 'ips'
            else 'pass' %}
          {{ action }} http any any -> $HOME_NET any (msg:"HTTP Big Bang Theory Detected"; content:"Big Bang Theory"; http_uri; sid:9000300; rev:1;)
          {{ action }} http any any -> $HOME_NET any (msg:"HTTP SQLi"; http.uri; content:"' OR '1'='1"; nocase; sid:9000301; rev:1;)
          {{ action }} http any any -> $HOME_NET any (msg:"HTTP Traversal"; http.uri; content:"../"; sid:9000302; rev:1;)
          {{ action }} http any any -> $HOME_NET any (msg:"HTTP sqlmap"; http.user_agent; content:"sqlmap"; nocase; sid:9000303; rev:1;)

    - name: "Deploy 40_tls.rules - TLS/SNI detection"
      when: suricata_rule_modules["40_tls.rules"]["enabled"] | bool
      ansible.builtin.copy:
        dest: "{{ suricata_rules_avail }}/40_tls.rules"
        mode: "0644"
        content: |
          # =================================================================
          # 40_tls.rules - TLS Detection
          # mode: {{ suricata_rule_modules["40_tls.rules"].mode | default('ids') }}
          # =================================================================
          {% set action = 'alert' if suricata_rule_modules["40_tls.rules"].mode | default('ids') == 'ids'
            else 'drop' if suricata_rule_modules["40_tls.rules"].mode | default('ids') == 'ips'
            else 'pass' %}
          {{ action }} tls any any -> any any (msg:"TLS example.com"; tls.sni; content:"example.com"; sid:9000401; rev:1;)
          {{ action }} tls any any -> any any (msg:"TLS example.org"; tls.sni; content:"example.org"; sid:9000402; rev:1;)
          {{ action }} tls any any -> any any (msg:"TLS example.net"; tls.sni; content:"example.net"; sid:9000403; rev:1;)
          # TLS version detection - tls.version keyword (Suricata 6.x)
          {{ action }} tls any any -> $HOME_NET any (msg:"TLS 1.0 Detected"; tls.version:1.0; sid:9000404; rev:2;)

    - name: "Deploy 50_telnet.rules - Telnet detection"
      when: suricata_rule_modules["50_telnet.rules"]["enabled"] | bool
      ansible.builtin.copy:
        dest: "{{ suricata_rules_avail }}/50_telnet.rules"
        mode: "0644"
        content: |
          # =================================================================
          # 50_telnet.rules - Telnet Detection
          # mode: {{ suricata_rule_modules["50_telnet.rules"].mode | default('ids') }}
          # =================================================================
          {% set action = 'alert' if suricata_rule_modules["50_telnet.rules"].mode | default('ids') == 'ids'
            else 'drop' if suricata_rule_modules["50_telnet.rules"].mode | default('ids') == 'ips'
            else 'pass' %}
          {{ action }} tcp any any -> $HOME_NET 23 (msg:"Telnet Big Bang Theory"; content:"Big Bang Theory"; sid:9000500; rev:1;)
          {{ action }} tcp any any -> $HOME_NET 23 (msg:"Telnet Login Attempt"; flow:to_server,established; content:"login"; nocase; sid:9000501; rev:1;)
          {{ action }} tcp any any -> $HOME_NET 23 (msg:"Telnet Password Attempt"; flow:to_server,established; content:"password"; nocase; sid:9000502; rev:1;)

    - name: "Deploy 60_scan.rules - Port scan detection"
      when: suricata_rule_modules["60_scan.rules"]["enabled"] | bool
      ansible.builtin.copy:
        dest: "{{ suricata_rules_avail }}/60_scan.rules"
        mode: "0644"
        content: |
          # =================================================================
          # 60_scan.rules - Port Scan Detection
          # mode: {{ suricata_rule_modules["60_scan.rules"].mode | default('ids') }}
          # =================================================================
          {% set action = 'alert' if suricata_rule_modules["60_scan.rules"].mode | default('ids') == 'ids'
            else 'drop' if suricata_rule_modules["60_scan.rules"].mode | default('ids') == 'ips'
            else 'pass' %}
          {{ action }} tcp any any -> $HOME_NET any (msg:"SYN Scan"; flags:S; threshold:type threshold, track by_src, count 10, seconds 2; sid:9000601; rev:1;)
          {{ action }} tcp any any -> $HOME_NET any (msg:"NULL Scan"; flags:0; sid:9000602; rev:1;)
          {{ action }} tcp any any -> $HOME_NET any (msg:"SCAN FIN"; flags:F; sid:9000603; rev:1;)
          {{ action }} tcp any any -> $HOME_NET any (msg:"SCAN XMAS"; flags:FPU; sid:9000604; rev:1;)
          {{ action }} udp any any -> $HOME_NET any (msg:"SCAN UDP"; threshold:type both, track by_src, count 20, seconds 3; sid:9000605; rev:1;)
          {{ action }} tcp any any -> $HOME_NET any (msg:"SCAN ACK"; flags:A; threshold:type both, track by_src, count 10, seconds 2; sid:9000606; rev:1;)

    - name: "Deploy 70_dns.rules - DNS anomaly + DDNS detection"
      when: suricata_rule_modules["70_dns.rules"]["enabled"] | bool
      ansible.builtin.copy:
        dest: "{{ suricata_rules_avail }}/70_dns.rules"
        mode: "0644"
        content: |
          # =================================================================
          # 70_dns.rules - DNS Anomaly & Dynamic DNS Detection
          # mode: {{ suricata_rule_modules["70_dns.rules"].mode | default('ids') }}
          # Observed live: dynupdate.no-ip.com queried by 10.10.10.101
          # =================================================================
          {% set action = 'alert' if suricata_rule_modules["70_dns.rules"].mode | default('ids') == 'ids'
            else 'drop' if suricata_rule_modules["70_dns.rules"].mode | default('ids') == 'ips'
            else 'pass' %}
          # DNS anomaly detection
          {{ action }} dns any any -> any any (msg:"DNS Long Query"; flow:to_server; dns.query; pcre:"/.{50,}/"; sid:9000701; rev:2;)
          {{ action }} dns any any -> any any (msg:"DNS Suspicious Encoded Query"; flow:to_server; dns.query; pcre:"/^[A-Za-z0-9+\/=]{30,}$/"; sid:9000702; rev:1;)
          {{ action }} dns any any -> any any (msg:"DNS Query for localhost"; flow:to_server; dns.query; content:"localhost"; nocase; sid:9000703; rev:1;)
          {{ action }} udp $HOME_NET any -> any 53 (msg:"DNS High Query Rate"; flow:to_server; threshold:type both, track by_src, count 100, seconds 5; sid:9000704; rev:1;)
          {{ action }} udp any any -> $HOME_NET !53 (msg:"DNS Response on Non-Standard Port"; flow:to_client; sid:9000705; rev:1;)
          # DDNS provider detection
          {{ action }} dns any any -> any 53 (msg:"DDNS Query no-ip.com"; flow:to_server; dns.query; content:"no-ip.com"; nocase; sid:9000706; rev:1;)
          {{ action }} dns any any -> any 53 (msg:"DDNS Query no-ip.org"; flow:to_server; dns.query; content:"no-ip.org"; nocase; sid:9000707; rev:1;)
          {{ action }} dns any any -> any 53 (msg:"DDNS Query no-ip.biz"; flow:to_server; dns.query; content:"no-ip.biz"; nocase; sid:9000708; rev:1;)
          {{ action }} dns any any -> any 53 (msg:"DDNS Query dyndns.org"; flow:to_server; dns.query; content:"dyndns.org"; nocase; sid:9000709; rev:1;)
          {{ action }} dns any any -> any 53 (msg:"DDNS Query dyndns.com"; flow:to_server; dns.query; content:"dyndns.com"; nocase; sid:9000710; rev:1;)
          {{ action }} dns any any -> any 53 (msg:"DDNS Query dyndns.tv"; flow:to_server; dns.query; content:"dyndns.tv"; nocase; sid:9000711; rev:1;)
          {{ action }} dns any any -> any 53 (msg:"DDNS Query duckdns.org"; flow:to_server; dns.query; content:"duckdns.org"; nocase; sid:9000712; rev:1;)
          {{ action }} dns any any -> any 53 (msg:"DDNS Query afraid.org"; flow:to_server; dns.query; content:"afraid.org"; nocase; sid:9000713; rev:1;)
          {{ action }} dns any any -> any 53 (msg:"DDNS Query dynu.com"; flow:to_server; dns.query; content:"dynu.com"; nocase; sid:9000714; rev:1;)
          {{ action }} dns any any -> any 53 (msg:"DDNS Query changeip.com"; flow:to_server; dns.query; content:"changeip.com"; nocase; sid:9000715; rev:1;)
          {{ action }} dns any any -> any 53 (msg:"DDNS Update Endpoint Query"; flow:to_server; dns.query; pcre:"/^(dynupdate|ddns-update|update|dyn)\..{4,}/i"; sid:9000716; rev:1;)
          {{ action }} dns any any -> any 53 (msg:"DDNS Random Hostname Pattern"; flow:to_server; dns.query; pcre:"/^[a-z0-9\-]{4,20}\.(no-ip|dyndns|duckdns|dynu|ddns|hopto|zapto|bounceme)\.(com|org|net|biz|tv|info)/i"; sid:9000717; rev:1;)
          {{ action }} dns any any -> any 53 (msg:"DDNS C2 Beacon no-ip"; flow:to_server; dns.query; content:"no-ip.com"; nocase; threshold:type both, track by_src, count 10, seconds 60; sid:9000718; rev:1;)
          {{ action }} dns any any -> any 53 (msg:"DDNS C2 Beacon dyndns"; flow:to_server; dns.query; content:"dyndns.org"; nocase; threshold:type both, track by_src, count 10, seconds 60; sid:9000719; rev:1;)

    - name: "Deploy 80_ssh.rules - SSH detection"
      when: suricata_rule_modules["80_ssh.rules"]["enabled"] | bool
      ansible.builtin.copy:
        dest: "{{ suricata_rules_avail }}/80_ssh.rules"
        mode: "0644"
        content: |
          # =================================================================
          # 80_ssh.rules - SSH Detection
          # mode: {{ suricata_rule_modules["80_ssh.rules"].mode | default('ids') }}
          # =================================================================
          {% set action = 'alert' if suricata_rule_modules["80_ssh.rules"].mode | default('ids') == 'ids'
            else 'drop' if suricata_rule_modules["80_ssh.rules"].mode | default('ids') == 'ips'
            else 'pass' %}
          {{ action }} tcp any any -> $HOME_NET 22 (msg:"SSH Connection Burst"; flow:to_server; flags:S; threshold:type both, track by_src, count 10, seconds 30; sid:9000801; rev:1;)
          {{ action }} tcp any any -> $HOME_NET 22 (msg:"SSH Banner Detected"; flow:to_server,established; content:"SSH-"; depth:4; sid:9000802; rev:1;)
          {{ action }} tcp any any -> $HOME_NET !22 (msg:"SSH on Non-Standard Port"; flow:to_server,established; content:"SSH-"; depth:4; sid:9000803; rev:1;)

    - name: "Deploy 90_ftp.rules - FTP detection"
      when: suricata_rule_modules["90_ftp.rules"]["enabled"] | bool
      ansible.builtin.copy:
        dest: "{{ suricata_rules_avail }}/90_ftp.rules"
        mode: "0644"
        content: |
          # =================================================================
          # 90_ftp.rules - FTP Detection
          # mode: {{ suricata_rule_modules["90_ftp.rules"].mode | default('ids') }}
          # =================================================================
          {% set action = 'alert' if suricata_rule_modules["90_ftp.rules"].mode | default('ids') == 'ids'
            else 'drop' if suricata_rule_modules["90_ftp.rules"].mode | default('ids') == 'ips'
            else 'pass' %}
          {{ action }} tcp any any -> $HOME_NET 21 (msg:"FTP Anonymous Login Attempt"; flow:to_server,established; content:"USER anonymous"; nocase; sid:9000901; rev:1;)
          {{ action }} tcp any any -> $HOME_NET 21 (msg:"FTP USER Command"; flow:to_server,established; content:"USER "; sid:9000902; rev:1;)
          {{ action }} tcp any any -> $HOME_NET 21 (msg:"FTP PASS Command"; flow:to_server,established; content:"PASS "; sid:9000903; rev:1;)
          {{ action }} tcp any any -> $HOME_NET 21 (msg:"FTP PORT Command (Bounce Attempt)"; flow:to_server,established; content:"PORT "; sid:9000904; rev:1;)

    - name: "Deploy 100_smtp.rules - SMTP detection"
      when: suricata_rule_modules["100_smtp.rules"]["enabled"] | bool
      ansible.builtin.copy:
        dest: "{{ suricata_rules_avail }}/100_smtp.rules"
        mode: "0644"
        content: |
          # =================================================================
          # 100_smtp.rules - SMTP Detection
          # mode: {{ suricata_rule_modules["100_smtp.rules"].mode | default('ids') }}
          # =================================================================
          {% set action = 'alert' if suricata_rule_modules["100_smtp.rules"].mode | default('ids') == 'ids'
            else 'drop' if suricata_rule_modules["100_smtp.rules"].mode | default('ids') == 'ips'
            else 'pass' %}
          {{ action }} tcp any any -> $HOME_NET 25 (msg:"SMTP RCPT Probe"; flow:to_server,established; content:"RCPT TO:"; nocase; sid:9001001; rev:1;)
          {{ action }} tcp any any -> $HOME_NET 25 (msg:"SMTP AUTH Flood"; flow:to_server,established; content:"AUTH LOGIN"; threshold:type both, track by_src, count 5, seconds 30; sid:9001002; rev:1;)
          {{ action }} tcp any any -> $HOME_NET 25 (msg:"SMTP EHLO IP Literal"; flow:to_server,established; content:"EHLO ["; sid:9001003; rev:1;)

    - name: "Deploy 110_policy.rules - Policy enforcement"
      when: suricata_rule_modules["110_policy.rules"]["enabled"] | bool
      ansible.builtin.copy:
        dest: "{{ suricata_rules_avail }}/110_policy.rules"
        mode: "0644"
        content: |
          # =================================================================
          # 110_policy.rules - Acceptable Use / Policy Enforcement
          # mode: {{ suricata_rule_modules["110_policy.rules"].mode | default('ids') }}
          # =================================================================
          {% set action = 'alert' if suricata_rule_modules["110_policy.rules"].mode | default('ids') == 'ids'
            else 'drop' if suricata_rule_modules["110_policy.rules"].mode | default('ids') == 'ips'
            else 'pass' %}
          # Cleartext protocols
          {{ action }} tcp any any -> $HOME_NET 23 (msg:"POLICY Telnet Usage"; flow:to_server,established; sid:9001101; rev:2;)
          # Botnet indicators
          {{ action }} tcp $HOME_NET any -> any 6667 (msg:"POLICY Outbound IRC"; flow:to_server; sid:9001102; rev:2;)
          {{ action }} tcp $HOME_NET any -> any 9001 (msg:"POLICY Possible Tor Relay"; flow:to_server; sid:9001103; rev:1;)
          {{ action }} tcp $HOME_NET any -> any 9050 (msg:"POLICY Tor SOCKS Proxy"; flow:to_server; sid:9001104; rev:1;)
          # HTTP auth header detection
          {{ action }} http any any -> $HOME_NET any (msg:"POLICY HTTP Basic Auth"; flow:to_server,established; http.header; pcre:"/Authorization:\s*Basic\s+[A-Za-z0-9+\/=]{20,}/i"; sid:9001105; rev:1;)
          {{ action }} http any any -> $HOME_NET any (msg:"POLICY HTTP Bearer Token"; flow:to_server,established; http.header; pcre:"/Authorization:\s*Bearer\s+[A-Za-z0-9\-._~+\/=]{20,}/i"; sid:9001106; rev:1;)
          {{ action }} http any any -> $HOME_NET any (msg:"POLICY HTTP Digest Auth"; flow:to_server,established; http.header; pcre:"/Authorization:\s*Digest\s+[A-Za-z0-9+\/=]{20,}/i"; sid:9001107; rev:1;)
          {{ action }} http any any -> $HOME_NET any (msg:"POLICY HTTP NTLM Auth"; flow:to_server,established; http.header; pcre:"/Authorization:\s*NTLM\s+[A-Za-z0-9+\/=]{20,}/i"; sid:9001108; rev:1;)
          # Sensitive path access
          {{ action }} http any any -> $HOME_NET any (msg:"POLICY HTTP Login Page"; flow:to_server,established; http.uri; content:"/login"; nocase; sid:9001109; rev:1;)
          {{ action }} http any any -> $HOME_NET any (msg:"POLICY HTTP Admin Path"; flow:to_server,established; http.uri; content:"/admin"; nocase; sid:9001110; rev:1;)
          # Covert channel
          {{ action }} icmp any any -> $HOME_NET any (msg:"POLICY Large ICMP Payload"; dsize:>512; sid:9001111; rev:1;)
          # Database / remote access (BUG FIX #9: each port appears exactly once)
          {{ action }} tcp any any -> $HOME_NET 3306 (msg:"POLICY MySQL Access"; flow:to_server,established; sid:9001112; rev:1;)
          {{ action }} tcp any any -> $HOME_NET 1433 (msg:"POLICY MSSQL Access"; flow:to_server,established; sid:9001113; rev:1;)
          {{ action }} tcp any any -> $HOME_NET 6379 (msg:"POLICY Redis Access"; flow:to_server,established; sid:9001114; rev:1;)
          {{ action }} tcp any any -> $HOME_NET 5900 (msg:"POLICY VNC Access"; flow:to_server,established; sid:9001115; rev:1;)
          {{ action }} tcp any any -> $HOME_NET 3389 (msg:"POLICY RDP Access"; flow:to_server,established; sid:9001116; rev:1;)

    - name: "Deploy 120_local.rules - Test rules"
      when: suricata_rule_modules["120_local.rules"]["enabled"] | bool
      ansible.builtin.copy:
        dest: "{{ suricata_rules_avail }}/120_local.rules"
        mode: "0644"
        content: |
          # =================================================================
          # 120_local.rules - Local Test Rules
          # Use these to verify each protocol decoder is active.
          # mode: {{ suricata_rule_modules["120_local.rules"].mode | default('ids') }}
          # =================================================================
          alert icmp any any -> any any        (msg:"ICMP Test Rule";   sid:9009901; rev:1;)
          alert http any any -> $HOME_NET any  (msg:"HTTP Test Rule";   content:"Test"; http_uri; sid:9009902; rev:1;)
          alert tcp  any any -> $HOME_NET 12345 (msg:"TCP Test Rule";   content:"Test"; sid:9009903; rev:1;)
          alert tls  any any -> $HOME_NET any  (msg:"TLS Test Rule";    tls.sni; content:"Test"; sid:9009904; rev:1;)
          alert dns  any any -> $HOME_NET any  (msg:"DNS Test Rule";    dns.query; content:"Test"; sid:9009905; rev:1;)
          alert tcp  any any -> $HOME_NET 22   (msg:"SSH Test Rule";    content:"Test"; sid:9009906; rev:1;)
          alert tcp  any any -> $HOME_NET 21   (msg:"FTP Test Rule";    content:"Test"; sid:9009907; rev:1;)
          alert tcp  any any -> $HOME_NET 25   (msg:"SMTP Test Rule";   content:"Test"; sid:9009908; rev:1;)
          alert tcp  any any -> $HOME_NET 23   (msg:"Telnet Test Rule"; content:"Test"; sid:9009909; rev:1;)

    # ENABLING MODULES VIA SYMLINKS 
    - name: "Remove all existing symlinks in enabled/ (clean slate)"
      ansible.builtin.shell:
        cmd: "find {{ suricata_rules_enabled }} -maxdepth 1 -type l -delete"
      changed_when: false

    - name: "Create symlinks for modules with enabled: true"
      ansible.builtin.file:
        src:   "{{ suricata_rules_avail }}/{{ item.key }}"
        dest:  "{{ suricata_rules_enabled }}/{{ item.key }}"
        state: link
        force: true
      loop: "{{ suricata_rule_modules | dict2items }}"
      loop_control:
        label: "{{ item.key }} (enabled={{ item.value['enabled'] }})"
      when: item.value["enabled"] | bool

    - name: " Report disabled modules (no symlink created)"
      ansible.builtin.debug:
        msg: "SKIPPED (enabled: false): {{ item.key }}"
      loop: "{{ suricata_rule_modules | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: not (item.value["enabled"] | bool)

    # BUILD UNIFIED local.rules FROM ENABLED MODULES
    - name: "Step 4 | Build unified local.rules from enabled/ symlinks"
      ansible.builtin.shell: |
        echo "# =============================================================" > {{ local_rules }}
        echo "# local.rules - Auto-generated by Ansible"                       >> {{ local_rules }}
        echo "# DO NOT EDIT manually - changes will be overwritten."           >> {{ local_rules }}
        echo "# Generated: $(date -Iseconds)"                                  >> {{ local_rules }}
        echo "# =============================================================" >> {{ local_rules }}
        for f in $(ls {{ suricata_rules_enabled }}/*.rules 2>/dev/null | sort); do
          echo "" >> {{ local_rules }}
          echo "# -- $(basename $f) --" >> {{ local_rules }}
          cat "$f" >> {{ local_rules }}
        done
      args:
        executable: /bin/bash
      changed_when: true

    - name: "Step 4 | Set local.rules permissions"
      ansible.builtin.file:
        path: "{{ local_rules }}"
        mode: "0644"

    - name: "Step 4 | Count active rules"
      ansible.builtin.shell:
        cmd: "grep -cE '^(alert|drop|pass)' {{ local_rules }} || true"
      register: rule_count
      changed_when: false

    - name: "Step 4 | Report rule count"
      ansible.builtin.debug:
        msg: "local.rules: {{ rule_count.stdout }} active rules (alert/drop/pass)"

    # VALIDATE CONFIGURATION  
    - name: "Step 5 | Validate Suricata configuration (dry run)"
      ansible.builtin.command:
        cmd: "suricata -T -c {{ suricata_yaml }} -v"
      register: suricata_test
      changed_when: false
      failed_when: >
        'successfully loaded' not in
        (suricata_test.stdout + suricata_test.stderr)
      tags: [suricata, rules, validate]

    - name: "Step 5 | Show validation result"
      ansible.builtin.debug:
        msg: >-
          {{
            (suricata_test.stderr_lines + suricata_test.stdout_lines)
            | select('match', '.*(Notice|Warning|Error|loaded|failed).*')
            | list
          }}
      tags: [suricata, rules, validate]

    # RELOAD RULES
    - name: "Step 6 | Confirm Suricata PID file exists"
      ansible.builtin.stat:
        path: "{{ suricata_pid }}"
      register: pid_stat
      tags: [suricata, rules, reload]

    - name: "Step 6 | Abort if Suricata is not running"
      ansible.builtin.fail:
        msg: >
          Suricata PID not found at {{ suricata_pid }}.
          Start Suricata first: sudo systemctl start suricata
      when: not pid_stat.stat.exists
      tags: [suricata, rules, reload]

    - name: "Step 6 | Reload Suricata rules (zero downtime via SIGUSR2)"
      ansible.builtin.shell:
        cmd: "kill -USR2 $(cat {{ suricata_pid }})"
      changed_when: true
      tags: [suricata, rules, reload]

    - name: "Step 6 | Wait for reload to complete"
      ansible.builtin.pause:
        seconds: 5
      tags: [suricata, rules, reload]

    - name: "Step 6 | Confirm rules reloaded in Suricata log"
      ansible.builtin.shell:
        cmd: "grep -i 'reload' {{ suricata_log_dir }}/suricata.log | tail -3"
      register: reload_log
      changed_when: false
      tags: [suricata, rules, reload]

    - name: "Step 6 | Show reload log"
      ansible.builtin.debug:
        msg: "{{ reload_log.stdout_lines }}"
      tags: [suricata, rules, reload]